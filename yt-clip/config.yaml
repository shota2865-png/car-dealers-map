# マックスむらい 切り抜き Shorts（むらいクリップ【切り抜き】 @maxmuraiclip）
# GitHub Actions（.github/workflows/clip-daily.yml）が毎日これを読んで動く。

channel:
  name: むらいクリップ【切り抜き】
  handle: "@maxmuraiclip"
  id: UCzHObRAWlTh97yX1XSfumcw
  # GitHub Secrets の鍵の名前の頭（CLIP_YOUTUBE_CLIENT_ID / _SECRET / _REFRESH_TOKEN）
  env_prefix: CLIP_

schedule:
  per_day: 10
  # 公開時刻（日本時間）。per_day より少なければ最後の時刻を使い回す
  publish_times: ["18:00"]
  timezone: Asia/Tokyo

# 切り抜き元。ガイドライン（2026-05-20 改訂）で許可されている 3 チャンネルだけ
sources:
  # 新しい配信・動画（RSS で最新 15 本を見る）
  fresh:
    - {name: マックスむらいの宇宙株LIVE, id: UC3FHK8a17BbU7bWOZnRxM7Q, max_age_days: 4, per_video: 6}
    - {name: マックスむらい, id: UC5Y35HzjHnxi2Dk8Xk8Cllw, max_age_days: 4, per_video: 2}
  # 1 日のうち何本を「黄金期のアーカイブ」から出すか（新しい素材が足りない日はさらに増える）
  archive_per_day: 3
  # アーカイブ: 本チャンネルの人気動画から「よく見返された場所（ヒートマップ）」を切る
  archive:
    channel_handle: "@TheMaxMurai"
    pool_size: 120        # 人気順の上から何本を候補にするか
  # ガイドラインの対象外（むらいのショート・メンバー限定・限定公開）は取らない
  exclude_title_words: ["メンバー限定", "メンバーシップ限定", "切り抜き禁止"]

clip:
  min_sec: 30
  max_sec: 58
  # コメントの山は話の 10〜20 秒あとに来るので、山より前を厚めに取る
  lead_sec: 38
  tail_sec: 14
  gap_sec: 120            # 同じ動画から取る場面どうしの最低間隔

render:
  width: 1080
  height: 1920
  fps: 30
  font_black: ../yt-econ/assets/fonts/NotoSansJP-Black.ttf
  font_bold: ../yt-econ/assets/fonts/NotoSansJP-Bold.ttf
  max_height: 1080        # 取り込む元動画の最大画質

llm:
  # GitHub Models（GitHub Actions の GITHUB_TOKEN で無料枠）。使えないときは字幕から機械的に付ける
  provider: github_models
  model: openai/gpt-4.1-mini

upload:
  privacy_after_publish: public
  category_id: "20"       # Gaming（宇宙株は 22 People & Blogs でも可）
  made_for_kids: false
  tags: ["マックスむらい", "切り抜き", "Shorts"]
  # ガイドラインで説明欄に必ず書くクレジット（{source_url} は切り抜き元の URL に置き換わる）
  credit: |
    この動画は「マックスむらい/マクソン最大」切り抜きガイドラインに沿って公開をしています。

    ◆切り抜き元：
    {source_url}

    ◆「マックスむらい」関連情報：
    マックスむらい（ https://www.youtube.com/@TheMaxMurai ）
    マックスむらいの宇宙株LIVE( https://www.youtube.com/@MaxMuraiSpaceLIVE )
    マクソン最大（ https://www.youtube.com/@makusonsaidai ）
    X（ https://x.com/entrypostman ）
  # 投資の話の切り抜きに付ける注意書き
  investment_note: "※配信者個人の見解の切り抜きです。投資判断はご自身でお願いします。"
