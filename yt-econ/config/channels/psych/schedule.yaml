# 2 チャンネル目（現代人のための心理学）の手動スケジュール。書き方は本体の config/schedule.yaml と同じ。
# date を書けばその日だけ、書かなければ順番に消化する。日付は初回投稿日に合わせて書き換える。
# コンセプト: 通勤・家事・作業中に「ながら聴き」する 15〜20 分。テーマの軸は
#   AI / コスパ・タイパ / 感情が爆発する人（ヒステリック系） / SNS・スマホ / 仕事・職場 / 人間関係
# 「ヒステリー」という言葉は歴史的に偏見を含むので、タイトルや台本では使わず「急にキレる」「感情が爆発する」と言う。
queue:
  - date: 2026-09-25
    title: SNS を見ると疲れるのに、やめられないのはなぜか
    angle: 疲れる理由を「他人と比べてしまう心のくせ（社会的比較）」、やめられない理由を「いつ来るかわからないごほうび（変動報酬）」で分ける。見るだけの使い方と、やりとりする使い方で気分が変わるという研究を紹介し、今日からできる「見る時間」の区切り方を渡す
    horizon: flow
    why_now: スマホの利用時間が増え続け、「SNS 疲れ」という言葉が当たり前になった
    audience_hook: 寝る前にタイムラインを見て、なぜか気分が沈む人
    key_questions:
      - SNS を見ると疲れるのは、何と比べているからなのか
      - 疲れるのに、指が勝手に開いてしまうのはなぜか
      - やめなくていいから、疲れにくい使い方はあるのか
    sources:
      - {name: "Festinger 1954 A theory of social comparison processes（Human Relations）", url: "https://doi.org/10.1177/001872675400700202"}
      - {name: "Verduyn et al. 2015 Passive Facebook usage undermines affective well-being（Journal of Experimental Psychology: General）", url: "https://doi.org/10.1037/xge0000057"}
      - {name: "総務省 情報通信白書", url: "https://www.soumu.go.jp/johotsusintokei/whitepaper/"}
  - date: 2026-09-26
    title: 急にキレる人の頭の中で、何が起きているのか
    angle: 相手の行動を「わざとだ」と受け取りやすいくせ（敵意帰属バイアス）と、感情が周りにうつる仕組み（感情伝染）で説明する。キレる人を責めたり診断したりせず、巻き込まれないための距離の取り方と、自分がカッとなったときの最初の一手を渡す
    horizon: flow
    why_now: 職場・家庭・ネットで「急に感情が爆発する人」への疲れが話題になりやすい
    audience_hook: 上司や家族が急に怒りだして、自分のせいかと思ってしまう人
    key_questions:
      - 同じことをされても、怒る人と怒らない人がいるのはなぜか
      - 感情的な人のそばにいると、なぜこちらまで疲れるのか
      - 巻き込まれないために、その場でできることは
    sources:
      - {name: "Dodge 1980 Social cognition and children's aggressive behavior（Child Development）", url: "https://doi.org/10.2307/1129603"}
      - {name: "Hatfield, Cacioppo & Rapson 1993 Emotional contagion（Current Directions in Psychological Science）", url: "https://doi.org/10.1111/1467-8721.ep10770953"}
  - date: 2026-09-27
    title: AI に聞くほど、自分で考えなくなる？
    angle: 機械の答えを人より信じてしまう「自動化バイアス」と、覚えることを道具に任せる「認知的オフロード（頭の外に置くこと）」を分けて説明する。任せてよい場面と、まず自分で考えたほうがいい場面の見分け方を渡す。検索と記憶の有名な研究は、再現されにくかった点もきちんと言う
    horizon: flow
    why_now: 仕事でも勉強でも、生成 AI に聞くのが当たり前になりつつある
    audience_hook: AI の答えをそのまま使って、あとで「あれ、なんでこうなるんだっけ」となった人
    key_questions:
      - AI の答えを、つい信じてしまうのはなぜか
      - 道具に任せると、本当に頭は弱くなるのか
      - 任せていいことと、自分で考えたほうがいいことの境目は
    sources:
      - {name: "Parasuraman & Manzey 2010 Complacency and bias in human use of automation（Human Factors）", url: "https://doi.org/10.1177/0018720810376055"}
      - {name: "Risko & Gilbert 2016 Cognitive offloading（Trends in Cognitive Sciences）", url: "https://doi.org/10.1016/j.tics.2016.07.002"}
      - {name: "Sparrow et al. 2011 Google effects on memory（Science）と、その後の再現研究", url: "https://doi.org/10.1126/science.1207745"}
  - date: 2026-09-28
    title: 倍速で見ているのに、いつも時間が足りないのはなぜか
    angle: タイパ（時間の効率）を求めるほど疲れる理由を、選ぶものが多すぎると決められなくなる話（選択のパラドックス）と、先に結論だけ知りたくなる気持ちで説明する。有名な「ジャムの実験」は、その後の研究で効果がはっきりしなかったことも伝える。時間を取り戻すための「やらないことリスト」を渡す
    horizon: flow
    why_now: 動画の倍速視聴や「ネタバレを先に見る」視聴が広がっている
    audience_hook: 倍速で見て、見終わったのに何も残っていない感じがする人
    key_questions:
      - なぜ急いで見るほど、時間が足りなく感じるのか
      - 選ぶものが多いと、なぜ疲れるのか
      - タイパを気にしすぎないための、小さな工夫は
    sources:
      - {name: "稲田豊史『映画を早送りで観る人たち』（光文社新書 2022）", url: ""}
      - {name: "Iyengar & Lepper 2000 When choice is demotivating（Journal of Personality and Social Psychology）", url: "https://doi.org/10.1037/0022-3514.79.6.995"}
      - {name: "Scheibehenne et al. 2010 Can there ever be too many options?（メタ分析。Journal of Consumer Research）", url: "https://doi.org/10.1086/651235"}
  - date: 2026-09-29
    title: 会議で言い返せなかった夜に、布団の中で名文句を思いつくのはなぜか
    angle: 緊張すると言葉が出ないのは頭の中のメモ帳（作業記憶）が心配でうまるから。夜に浮かぶのは緊張がほどけてメモ帳が空くから。夜に何度も考え直す（反すう）と気分が重くなる研究を紹介し、次の会議の「一言目」を先に決めておく方法と、夜のうちに紙に書いて終わらせる手順を渡す
    horizon: flow
    why_now: 下半期のはじめで、会議や面談で意見を求められる場面が増える
    audience_hook: 会議や LINE で言い返せず、あとで一人反省会をしてしまう人
    key_questions:
      - 緊張すると言葉が出ないのは、何が起きているのか
      - 一人反省会は、なぜ夜に来て、なぜ止まらないのか
      - 次の会議で使える、いちばん短い一言目は
    sources:
      - {name: "Beilock & Carr 2005 When high-powered people fail（Psychological Science）", url: "https://doi.org/10.1111/j.0956-7976.2005.00789.x"}
      - {name: "Nolen-Hoeksema & Morrow 1993 Effects of rumination and distraction on naturally occurring depressed mood（Cognition and Emotion）", url: "https://doi.org/10.1080/02699939308409189"}
      - {name: "Gollwitzer 1999 Implementation intentions（American Psychologist）", url: "https://doi.org/10.1037/0003-066X.54.7.493"}
  - date: 2026-09-30
    title: 断れない人が、断れるようになる順番
    angle: 断れないのは性格ではなく「嫌われるかも」の見積もりが大きすぎるから。頼まれた人は断られたときの相手の気持ちを、実際より悪く想像しがちだという研究を紹介し、自分も相手も大事にする言い方（アサーション）を、いちばん小さな「一言」から練習する順番を渡す
    horizon: flow
    why_now: 年末に向けて頼まれごと・飲み会の誘いが増える時期
    audience_hook: 頼まれると断れず、あとで自分に腹が立つ人
    key_questions:
      - 断ると嫌われる、は本当か
      - 相手も自分も大事にする言い方とは
      - 今日から練習できる、いちばん小さな断り方は
    sources:
      - {name: "平木典子『アサーション入門』（講談社現代新書 2012）", url: ""}
      - {name: "Bohns 2016 (Mis)Understanding our influence over others（Current Directions in Psychological Science）", url: "https://doi.org/10.1177/0963721416635544"}
  - date: 2026-10-01
    title: 元を取ろうとして、かえって損をするのはなぜか
    angle: もう払ったお金や時間を取り返そうとして、やめられなくなる心のくせ（サンクコスト）と、損をとても大きく感じる心のくせ（損失回避）で説明する。サブスク・食べ放題・つまらない映画を例に、「今からの損と得だけで決める」練習を渡す
    horizon: flow
    why_now: サブスクの数が増え、「元を取らなきゃ」で時間を使ってしまう人が多い
    audience_hook: 食べ放題で苦しくなるまで食べたり、つまらない映画を最後まで見てしまう人
    key_questions:
      - もう払ったお金に、なぜ引っぱられてしまうのか
      - 損は、得よりどれくらい大きく感じるのか
      - 「やめる」を決めるための、かんたんな質問は
    sources:
      - {name: "Arkes & Blumer 1985 The psychology of sunk cost（Organizational Behavior and Human Decision Processes）", url: "https://doi.org/10.1016/0749-5978(85)90049-4"}
      - {name: "Kahneman & Tversky 1979 Prospect theory（Econometrica）", url: "https://doi.org/10.2307/1914185"}