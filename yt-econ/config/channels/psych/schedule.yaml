# 2 チャンネル目（心理学）の手動スケジュール。書き方は本体の config/schedule.yaml と同じ。
# date を書けばその日だけ、書かなければ順番に消化する。日付は初回投稿日に合わせて書き換える。
# コンセプト: 通勤・昼休みに聴く 13〜16 分。人間関係 × 習慣 × 感情。ずんだもん＝言い返せない・三日坊主の新社会人。
queue:
  - date: 2026-09-29
    title: 会議で言い返せなかった夜に、布団の中で名文句を思いつくのはなぜか
    angle: 「あのとき言えばよかった」が寝る前に来る仕組みを、覚醒度と作業記憶（緊張すると言葉が出ない）、反すう（終わった出来事を繰り返し考える）、ツァイガルニク効果（未完了の記憶は残る）で分解し、次に同じ場面が来たときの「一言目のテンプレ」と、その夜の反すうを止める書き出しの手順を渡す
    horizon: flow
    why_now: 新社会人が配属から半年、会議で発言を求められ始める時期。SNS で「言い返せなかった」投稿が増える
    audience_hook: 会議や LINE で言い返せず、あとで一人反省会をしてしまう新社会人
    key_questions:
      - 緊張すると言葉が出ないのは、頭が悪いからではなく何が起きているのか
      - 「一人反省会」はなぜ夜に来て、なぜ止まらないのか
      - 次の会議で使える、いちばん短い「一言目」は何か
    sources:
      - {name: 日本心理学会 心理学ワールド（反すうの解説）, url: https://psych.or.jp/publication/world/}
      - {name: 厚生労働省 こころの耳（ストレスと反すう）, url: https://kokoro.mhlw.go.jp/}
      - {name: 国立精神・神経医療研究センター, url: https://www.ncnp.go.jp/}
  - date: 2026-09-30
    title: 三日坊主は意志が弱いからではない。習慣の研究が言う「続く仕組み」
    angle: 「習慣化に 21 日」の俗説と、ロンドン大学の研究（平均 66 日、行動によって 18〜254 日）を対比し、続かない原因を意志力ではなく「きっかけ・行動の小ささ・報酬の速さ」の設計に置き換える。ずんだもんの筋トレ・英語・日記の失敗を実例に、今日から 2 分でできる版に縮める手順を渡す
    horizon: flow
    why_now: 下半期の始まりで「10 月から始める」宣言が増え、月末に脱落が出る
    audience_hook: 手帳と本を買っては 3 日で止まり、自分を責めている人
    key_questions:
      - 「21 日で習慣になる」はどこから来た数字で、本当のところは何日か
      - 続く人と続かない人の差は、性格ではなくどこにあるのか
      - 今日から始めるなら、どこまで小さくすればいいのか
    sources:
      - {name: Lally et al. 2010 European Journal of Social Psychology（習慣形成の日数）, url: https://onlinelibrary.wiley.com/doi/10.1002/ejsp.674}
      - {name: 日本心理学会 心理学ワールド, url: https://psych.or.jp/publication/world/}
  - date: 2026-10-01
    title: SNS を見ると疲れるのに、やめられない。社会的比較と「たまに当たる」報酬の話
    angle: フェスティンガーの社会的比較理論（人は近い他人と比べる）と、上方比較が自己評価を下げる研究、そしてスキナーの変動比率強化（いつ当たるか分からない報酬ほどやめにくい）で「同期の投稿を見て落ち込むのに開いてしまう」を説明する。アプリを消せとは言わず、比較の相手と時間帯を変える 2 つの設定を渡す
    horizon: bridge
    why_now: 海外では SNS の年齢制限と若者のメンタルの議論が法制化まで進み、日本でも報道が増えている
    audience_hook: 同期や友人の投稿を見て落ち込むのに、通知が来ると開いてしまう人
    key_questions:
      - なぜ「知らない有名人」より「同期」の投稿のほうが効くのか
      - やめられないのは依存症なのか、それとも設計のせいなのか
      - 消さずに疲れを減らすなら、何をどう変えるのか
    sources:
      - {name: 総務省 情報通信白書（SNS 利用時間）, url: https://www.soumu.go.jp/johotsusintokei/whitepaper/}
      - {name: Festinger 1954 A Theory of Social Comparison Processes, url: https://journals.sagepub.com/doi/10.1177/001872675400700202}
      - {name: 日本心理学会 心理学ワールド, url: https://psych.or.jp/publication/world/}
  - date: 2026-10-02
    title: やる気が出るのを待つと一生出ない。先に体を動かすと気分が付いてくる研究
    angle: 「やる気→行動」ではなく「行動→やる気」の順であること（行動活性化、作業興奮）を、うつの治療で使われる行動活性化療法の研究と、着手後に集中が立ち上がる実感の説明で示す。ずんだもんの「気分が乗ったらやる」を、5 分だけ着手する・場所を変える・最初の 1 手を前夜に決めるの 3 手に置き換える
    horizon: flow
    why_now: 10 月は資格試験・昇格試験の申し込みが多く、「やる気が出ない」相談が増える
    audience_hook: やる気が出るのを待って、気づけば夜になっている人
    key_questions:
      - 「やる気が出たらやる」はなぜ順番が逆なのか
      - 行動活性化はどんな研究で、どこまで効くと分かっているのか
      - 5 分だけ、のあとに止めたくなくなるのはなぜか
    sources:
      - {name: 厚生労働省 こころの耳（行動活性化）, url: https://kokoro.mhlw.go.jp/}
      - {name: 認知行動療法センター（国立精神・神経医療研究センター）, url: https://www.ncnp.go.jp/cbt/}
  - date: 2026-10-03
    title: 褒められると伸びる人と、崩れる人。内発的動機づけの研究が教える褒め方
    angle: 「ご褒美でやる気は増える」を疑う。デシの実験（報酬が内発的な興味を下げることがある）とドゥエックの研究（能力を褒めると挑戦を避け、過程を褒めると挑戦する）を対比し、再現性の議論にも触れる。新社会人が上司に褒められたとき、後輩を褒めるとき、自分を褒めるときの 3 場面で「何を褒めると崩れないか」を渡す
    horizon: stock
    why_now: 海外では「褒めて育てる」の反動として過程重視の育成が広がり、日本の新人研修にも降りてきている
    audience_hook: 褒められると逆にプレッシャーで動けなくなる人
    key_questions:
      - ご褒美がやる気を下げることがあるのは、どんなときか
      - 「頭がいいね」と「工夫したね」で、そのあとの行動はどう変わるのか
      - 自分を褒めるとき、何を褒めればいいのか
    sources:
      - {name: Deci 1971 Journal of Personality and Social Psychology, url: https://psycnet.apa.org/record/1971-22190-001}
      - {name: Mueller & Dweck 1998 Journal of Personality and Social Psychology, url: https://psycnet.apa.org/record/1998-04530-003}
  - date: 2026-10-04
    title: 断れない人が断れるようになる順番。アサーションの研究
    angle: 「断る＝関係が壊れる」という予測がどれほど外れているかを、頼みごとの実験（人は他人の拒否を過大に恐れる）と、攻撃的・受け身・アサーティブの 3 分類で示す。断れない理由を性格ではなく「断り方の型を持っていない」ことに置き、DESC 法（描写・表現・提案・結果）で、飲み会・残業・友人の頼みの 3 例の台詞を実際に作って渡す
    horizon: flow
    why_now: 歓迎会シーズンが落ち着き、誘いや頼みごとを断れない疲れが出る時期
    audience_hook: 頼まれると断れず、あとで自分に腹が立つ人
    key_questions:
      - 断ったときに相手がどう思うか、私たちはどれくらい読み違えているのか
      - 「断る」と「攻撃する」はどう違うのか
      - 明日使える断りの台詞を、型から作るとどうなるか
    sources:
      - {name: 日本アサーション協会, url: https://www.japan-assertion.org/}
      - {name: Flynn & Lake 2008 Journal of Personality and Social Psychology（援助要請の過小評価）, url: https://psycnet.apa.org/record/2008-08177-007}
  - date: 2026-10-05
    title: 「自分はダメだ」が頭から離れない夜に起きていること。反すうとセルフコンパッション
    angle: 失敗のあとに同じ考えが回り続ける「反すう」がなぜ止まらないか（問題解決のつもりで感情だけ増える）を研究で示し、自己批判が行動を改善しないこと、ネフのセルフコンパッション研究（自分に友人と同じ言葉をかける人のほうが立ち直りが速い）を紹介する。甘やかしとの違いを整理し、今夜できる「友人に言う言葉に置き換える」1 分の手順で終える
    horizon: bridge
    why_now: 海外では自己批判より自己への思いやりを重視する流れが企業研修にも入り、日本でも書籍が増えている
    audience_hook: 失敗を何度も思い返し、自分を責めることで頑張ろうとしてしまう人
    key_questions:
      - 反すうは考えているようで、なぜ何も解決しないのか
      - 自分に厳しくすると成長する、は本当か
      - 甘やかしにならないセルフコンパッションとは何か
    sources:
      - {name: Neff 2003 Self and Identity（セルフコンパッション）, url: https://self-compassion.org/wp-content/uploads/publications/SCtheoryarticle.pdf}
      - {name: 厚生労働省 こころの耳, url: https://kokoro.mhlw.go.jp/}
