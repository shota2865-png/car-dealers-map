# ============================================================
#  2 チャンネル目: 心理学 — 本体（config/channel.yaml）を継承して、違うところだけ書く
#
#  動かし方:  python -m ytecon --channel psych run     （環境変数 YTECON_CHANNEL=psych でも同じ）
#  鍵:        PSY_YOUTUBE_CLIENT_ID / PSY_YOUTUBE_CLIENT_SECRET / PSY_YOUTUBE_REFRESH_TOKEN
#             （無ければ本体の YOUTUBE_* に落ちる = 同じアカウント・同じクォータで動く）
#  ここに無い設定はすべて本体と同じ（深いマージ。リストは丸ごと置き換え）。
# ============================================================
extends: ../../channel.yaml

channel:
  key: "psych"
  env_prefix: "PSY_"
  # 画面の左上・Shorts の上部・冒頭のあいさつ（「現代人のための心理学へ、ようこそ。」）に出る
  name: "現代人のための心理学"
  audience: "20〜30代の会社員と大学生。AI・SNS・コスパ/タイパ・職場の人間関係・感情的な人への対応に疲れていて、心理学の本を買っては最後まで読めていない層"
  # ながら聴き（通勤・家事・作業中。画面を見ない人がいる前提で、声だけで全部わかるように話す。本編は 15〜20 分）
  listening_mode: "daytime"
  speech_style: "zundamon"
  # --- 分野の言葉（台本・企画・Shorts・概要欄のプロンプトに入る） ---
  field: "心理学"
  lens: "心理学"
  topic_words: "AI・SNS とスマホ・コスパ/タイパ・仕事と職場・人間関係・感情が爆発する人"
  term_examples: "社会的比較 / 変動報酬 / 自動化バイアス / サンクコスト / 損失回避 / 感情伝染 / 敵意帰属バイアス / 心理的安全性"
  pitch: "AI・SNS・タイパの時代に、人の心がどう動くかを、ながら聴きで。"
  disclaimer: |-
    この動画は心理学の研究や理論を一般向けに紹介するもので、医学的な診断や治療の代わりにはなりません。
    つらさが続くときは、医療機関や相談窓口（こころの健康相談統一ダイヤル 0570-064-556 など）にご相談ください。
  hook_examples:
    question: "なんで倍速で見ちゃう？ / 急にキレる人の頭の中は？"
    gap: "AIに聞くほど、自分で考えなくなる？"
    claim: "タイパを求めるほど疲れる / 既読スルーは嫌われたサインではない"
  hashtags: ["#心理学", "#人間関係", "#現代人"]
  generic_words: ["心理", "心理学", "心", "人間", "感情", "性格", "行動"]

  tone: |
    - 中学生でも分かる言葉に言い換える。専門用語は必ず初出で1文の言い換えを添える
    - 上から目線で教えない。「一緒に観察する」トーン。視聴者の行動を笑わない
    - 研究は「◯◯の研究では」と出典を言い、再現されていない有名な実験（例: 一部の権威実験や刷り込み系）はそう断る
    - 診断しない。「あなたは◯◯型」「これは◯◯障害」のような言い方をしない
    - 不安を煽らない。「ヤバい」「終わった」「知らないと損」は使わない
    - 1文は20〜30字。長いと合成音声の抑揚が単調になり、聞き手が迷子になる
    - 体言止めを多用しない
    - 各セクションの終わりに、今日その場で試せる 1 つのことか、自分に当てはめる 1 つの問いを置く
    - 「性格を変えろ」と言わない。環境と手順を変える案を出す
  banned_topics:
    - 精神疾患の診断・治療法の断定、薬の推奨や中止の助言
    - 自殺・自傷の方法や具体的な描写
    - 特定の個人・企業・集団への誹謗中傷、性格の決めつけ
    - 血液型性格診断・MBTI の断定的な扱いなど、科学的根拠の薄いものを事実として語ること
    - 出典不明の実験・統計、再現に失敗した研究を定説として話すこと
    - 恋愛・対人の「操作テクニック」（相手を思いどおりに動かす類）

video:
  # 見た目: デジタル庁デザインシステム準拠（白地・青。config/design_tokens.yaml の dads）
  design: "dads"
  target_minutes_min: 15.0
  target_minutes_max: 20.0

script:
  # 構成の 9 ブロックは本体と同じスタイルバイブルを使う（identity の「経済学のレンズ」は台本プロンプト側で心理学に置き換わる）
  style_bible_file: ""

topics:
  schedule_file: "config/channels/psych/schedule.yaml"
  frontier_seeds:
    - "米国で広がった『セラピー用語の日常化』（gaslighting / boundaries）が日本の会話に入ってくる経路"
    - "海外の『ドーパミン断ち』ブームの科学的な裏づけと、日本での受け止め方"
    - "欧米の職場で定着した心理的安全性が、日本の新人研修に降りてくるまで"
    - "米国 Z 世代の『静かな退職』と、日本の若手のやる気の測り方"
    - "海外の SNS 年齢制限の議論と、10 代・20 代のメンタルの研究"
    - "米国で流行した『マニフェステーション（引き寄せ）』を心理学はどう見ているか"
    - "海外の学校で広がる感情教育（SEL）と日本の道徳"
    - "海外で研究が進む『孤独』の健康影響と、日本の一人暮らし"
    - "米国の大学で問題化した完璧主義の増加と、日本の就活"
    - "海外の企業で使われる性格検査の妥当性の議論と、日本の適性検査"
  rss_sources:
    - name: "Yahoo!ニュース ライフ"
      url: "https://news.yahoo.co.jp/rss/topics/life.xml"
    - name: "Yahoo!ニュース 科学"
      url: "https://news.yahoo.co.jp/rss/topics/science.xml"
    - name: "ScienceDaily Psychology"
      url: "https://www.sciencedaily.com/rss/mind_brain/psychology.xml"
    - name: "PsyPost"
      url: "https://www.psypost.org/feed"
  evergreen_seeds:
    # AI
    - "AIに聞くほど、自分で考えなくなるのはなぜか（自動化バイアスと認知的オフロード）"
    - "AIの答えを、人の答えより信じてしまう理由と、疑ったほうがいい場面"
    - "仕事をAIに取られる不安は、なぜ夜に大きくなるのか（不確実性と不安）"
    # コスパ・タイパ
    - "動画を倍速で見るのに、なぜかいつも時間が足りない（タイパの心理）"
    - "コスパを気にするほど、選ぶのに疲れる（選択のパラドックスと決定疲れ）"
    - "元を取ろうとして損をする（サンクコスト）"
    # 感情が爆発する人（ヒステリック系）
    - "急にキレる人の頭の中で起きていること（敵意帰属バイアス）"
    - "怒りは6秒で消えるは本当か。感情の研究で確かめる"
    - "感情的な人のそばにいると、なぜこちらまで疲れるのか（感情伝染）"
    # SNS・スマホ
    - "SNS を見ると疲れるのに、やめられないのはなぜか（社会的比較と変動報酬）"
    - "既読スルーがこんなに気になる理由（拒絶への敏感さ）"
    - "通知が来ていないのに、スマホを見てしまう（ファントム・バイブレーション）"
    # 仕事・職場
    - "会議で言い返せなかった夜に、布団で名文句を思いつくのはなぜか（作業記憶と反すう）"
    - "先延ばしは時間管理の問題ではなく、気分の問題である"
    - "褒められると伸びる人と、崩れる人の差（内発的動機づけ）"
    # 人間関係
    - "断れない人が断れるようになる、順番（アサーション）"
    - "嫌われたくない気持ちが、かえって距離をつくる（承認欲求と自己開示）"
    - "初対面で好かれる人がやっている、たった1つのこと（返報性）"

cast:
  mode: solo
  characters: []

render:
  bgm:
    enabled: true
    # 本体（Up to No Good）と別の曲。素材 zip の assets/bgm/ に入れておくこと（無ければ置いてある曲に落ちる）
    file: "Yair Cohen - Rise Within.mp3"
    volume_db: -9
    ducking: true
    mood_timeline: true
  sfx:
    enabled: false

# 声は四国めたんだけ（立ち絵なし・字幕なし）。参加型テストの Shorts（quiz）はこの声で文節ごとに合成する
tts:
  provider: "voicevox"
  voicevox:
    speaker: 2
    speed: 1.02
    pitch: 0.0
    intonation: 1.05

character:
  enabled: false

# 本編（16:9・15〜20 分・ながら聴き）。台本は src/ytecon/honpen.py、画面は wide.py、組み立ては quiz.build(wide=True)
# あいさつ（greeting / closing）・聴かれ方（listener / tone）も honpen.py の既定を上書きできる
honpen:
  model: "claude-opus-5"
  effort: "high"
  minutes: 18
  parts: 4                  # 章の数（各章に 2 択クイズが 1 問）
  part_chars_min: 1400      # 4 章 × この字数 + 冒頭と締め ≒ 17〜19 分
  part_chars_max: 1650
  speed: 1.02               # Shorts と同じ
  seg_gap: 0.25             # 文節の間
  scene_tail: 0.8           # 場面の終わりの余韻
  count_tick: 1.1           # カウントダウン 1 拍（数も声で読む。画面を見ない人向け）
  voice_countdown: true
  outro_seconds: 0          # 寝落ち向けの「暗くして音楽だけ」はやらない
  bgm_db: -20
  title_prefix: ""
  thumb_note: "ながら聴きOK・声だけでわかる"

upload:
  privacy: "public"
  thumbnail_dir: "thumbnails/psych"
  finals_dir: "finals/psych"
  # 完成品の名前: ps_001_20260929（本体の yt_ と分ける）
  finals_prefix: "ps"
  # 本体の 19:00 とずらす（同じ人が両方見に来ても重ならないように）
  publish_times_jst: ["20:00"]
  category_id: "27"      # Education
  playlist_title: "現代人のための心理学"
  title_hook_tag: true
  title_suffix: "【現代人のための心理学】"

shorts:
  per_video: 3
  # quiz = 参加型テスト（2 択 → 研究 → 今日のひとつ）。src/ytecon/quiz.py
  mode: quiz
  model: "claude-opus-5"
  effort: "medium"
  bgm_db: -22
  cta:
    - "続きは本編で。"
    - "本編は毎日20時。下のリンクから。"
  # 朝の通勤・昼休み・夜のくつろぎ時間
  publish_times_jst: ["07:30", "12:30", "21:30"]

thumbnail:
  # サムネは手で作る（thumbnails/psych/ に置く）。無い日だけ framed で自動生成
  style: "framed"

goal:
  file: "config/channels/psych/goals.yaml"

pipeline:
  # honpen = 寝落ち向け 30 分の本編（honpen.py + wide.py）と、章から作る参加型テストの Shorts
  format: "honpen"
  # 初回の公開日。これより前の日の分は作らない（鍵を先に GitHub に入れておいてよい）
  start_date: "2026-09-29"
  videos_per_day: 1
  workdir: "output/psych"
  retries: 2
