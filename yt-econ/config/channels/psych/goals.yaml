# 2 チャンネル目（心理学）の目標。読み方は本体の config/goals.yaml と同じ（ytecon --channel psych goal）
# 10 月末（2026-10-31）までに「登録者 100 人・本編の総再生時間 500 時間・Shorts の平均 1 万再生」。本体と同じ数字で追う。

goal:
  name: "10月末: 登録者100・本編500時間・Shorts平均1万（心理学）"
  start: 2026-09-25          # 初回投稿日
  days: 37                   # 2026-10-31 まで
  views: 250000              # 合計は目安
  mix: {shorts: 0.85, long: 0.15}
  per_day: {long: 1, shorts: 5}

targets:
  subscribers: 100
  long_watch_hours: 500
  shorts_avg_views: 10000

ypp:
  subscribers: 1000
  watch_hours_12m: 4000
  shorts_views_90d: 10000000

gates:
  - {day: 11, views: 40000,  subscribers: 20,  long_hours: 40}
  - {day: 18, views: 90000,  subscribers: 40,  long_hours: 110}
  - {day: 27, views: 160000, subscribers: 70,  long_hours: 250}
  - {day: 37, views: 250000, subscribers: 100, long_hours: 500}

rules:
  long:
    avg_view_pct_min: 0.30
    views_7d_min: 300
  shorts:
    avg_view_pct_min: 0.75
    views_3d_min: 500
