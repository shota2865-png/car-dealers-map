voice:
  summary: 一夫一婦制という制度を、時事トピック（ヒカルのオープンマリッジ公表と離婚）を入口に、遺伝学・動物行動学・進化生物学・経済史・哲学・現行法の順で解体していく20分の解説ナレーション。『みんなが当たり前と思っている制度は、実は別の目的のために作られた装置だった』という一本の解剖線を最後まで外さず、視聴者を『我々』に含めたまま、判定ではなく分解に徹する。1文47字・話速389字/分と、密度は高いが情報の投げ込みではなく、証拠→解釈→問い直しの三拍子で毎ブロックを閉じる。
  person: 一人称は原則『我々』（『私』『僕』は出さない）。視聴者を『あなた』と切り離さず、話者自身も含めた人類全体として扱う。語尾は常体の書き言葉ナレーション（『〜のだ』『〜である』『〜だろう』『〜に過ぎない』）。読者への呼びかけ（『皆さん』『ぜひ』）、自己紹介、チャンネル名の言及は一切しない。話者は自分の体験・立場・感情を一度も語らない匿名の解剖者。
  stance: 賛成も反対もしない解剖者。題材の当事者（ヒカル）を裁かず、『あの身勝手な言葉の響きは不思議と我々の耳に残り続ける』のように、批判されやすい対象を『矛盾を正確についている』側の証人として使い直す。既存の通説（『やはり無理な話だった』『男余りが暴動を生む』など）を一度『なるほど。確かに一理ある仮説だ』と受け止めてから、『だがそれだけで〜と説明できた気になるのはあまりに気が早い』と足りなさを指摘して次の層へ進む。結論は制度の擁護でも破壊でもなく、『制度が何のための器だったか』の提示で止める。
  opening_pattern: 4段構成で約90秒。①〈誰もが口にしがちな断定的なひと言〉を裸で1文置く（例：『他に好きな人ができたなら別れればいい。』）→②その断定をする我々自身の滑稽さを1〜2文で突く（『自分のことなら職を決めるだけでも迷うくせに』のように、自分の日常の迷いと対比する）→③〈年月＋固有名＋出来事〉で時事を事実として3〜4文で圧縮提示し、その後日談（撤回・破局）まで一気に書く→④『1組の破局が教えてくれることなどたかが知れている』と事例の射程をあえて縮め、『だが〜』で本題へ折り返す。締めは問いの三連投（『なぜ今の相手とは別れたくないのか』『夫婦でいるとは何を続けることなのか』『なぜ結婚相手は1人でなくてはならないのか』）＋『今回は〈入口の現象〉を手がかりに、我々が〈当たり前の制度〉に縛られ続ける理由を解剖してみよう。』の一文で予告を閉じる。このとき本編で扱う論点を『3つの営み』のように数で括っておく。
  transition_pattern: ブロック間は必ず『問い』で渡す。型は3種を回す。①反語型：ブロック末で『では我々人類はどちらの設計図を持っているのか。』『だとすれば我々が今の配偶者と続けたいものとは一体何なのだろうか。』と問い、次ブロックの冒頭がその答えの証拠から始まる。②留保型：直前の説明を『なるほど。確かに一理ある仮説だ。』と一度肯定し、『だがそれだけで〜を説明できた気になるのはあまりに気が早い』で不足を宣言して次の材料を出す。③早合点封じ型：数字や事例を出した直後に『これを見て〈素朴な解釈〉と納得するのはあまりに早計だ。ここに現れているのは〈X〉ではない。〈Y〉に過ぎない。』と読み替える。新しい分野に移るときは『この〈概念〉が抱えるもろさは〈別領域〉を見渡せばより鮮明になる』のように、前ブロックのキーワードを主語にして橋を架け、分野名（生物学・哲学・民法）を言い切ってから入る。
  closing_pattern: 冒頭で立てた問いに、分解の結果を代入して答える。型は『つまり〈制度〉は〈世間が思っている目的〉のための制度ではない。〈機能A〉であると同時に、〈機能B〉のためのただの器に過ぎなかったのだ。』という否定＋二重定義。そのうえで現代の制度（民法・婚姻届・戸籍）に着地させ、『どれほど〜しようとも、〜は常に1人のままだ』と、現在も我々を縛っている形を提示する。最後は感情的な励ましや行動喚起を置かず、開いた問い（『では、性欲の寿命が切れた後に残るものは何か』型）か、制度の素っ気なさの指摘（『婚姻届に、相手をどれほど愛しているかを書く欄など存在しない』型）で余韻を作って切る。チャンネル登録の依頼、次回予告、まとめ箇条書きは置かない。
  jargon_policy: 専門用語は必ず『用語→その場で1文の定義→具体例』の順で出し、定義せずに投げっぱなしにしない（例：『オープンマリッジ』を直後に『夫婦でいることを続けながら、配偶者以外との恋愛や性的な関係を互いに認める結婚の形である』と言い直す）。学術概念は対概念でペア提示すると定着する（社会的一夫一婦／遺伝的一夫一婦）。人名は『遺伝学者マルテン・ラルムゾー』『哲学者イマヌエル・カント』のように〈肩書＋フルネーム〉で初出させ、以後は姓のみ。出典は『19世紀後半、フリードリヒ・エンゲルスは〜と論じた』のように年代＋人名＋主張の要約1文で済ませ、書名・論文名・引用符付きの逐語引用は使わない。学者の主張は要約したうえで『〜というわけだ』『〜と言いきる』と地の文に溶かす。
  number_policy: 数字は主張の核になるものだけを、1ブロックに1〜2個。必ず『何を測った数字か』を直後に限定し直す（『1世代あたり約1%の父親のすり替え』→『これは不貞の回数ではない。夫の子として社会的に育て上げた確率に過ぎない』）。同じ指標の条件違いを並べて振れ幅を見せる（通常1%／19世紀末の人口密集地では6%近く）。研究は『19年、遺伝学者〇〇は500年分の家系図と子孫のDNAを照合する実験を行った』のように〈年・人・規模・方法〉を1文にまとめて提示する。数値の出ない比較（チンパンジーとゴリラの精巣サイズ）は数字を作らず、大小と理由だけで語る。パーセントの列挙、統計の羅列、グラフ前提の説明はしない。
  sentence_rhythm: 1文平均45〜50字、話速は1分あたり380〜400字を目安に、間を作らず流し続ける。長短の交替が基本リズム：60〜80字の説明文を2〜3本続けたあと、20〜30字の短い断定（『数を打つことこそが自らの血をつなぐための武器だったのだ。』『一組の破局が教えてくれることなど、たかが知れている。』）で杭を打つ。接続は『だが』『しかし』『つまり』『だとすれば』『だからこそ』を文頭に置いて論理の向きを毎回明示する。段落末は『〜のだ』『〜に過ぎないのだ』『〜だろうか』で閉じ、同じ語尾を3連続させない。比喩は1ブロックに1つまでで、必ず制度・身体の側に引き戻す（『風が吹けば瓦解する砂の城のような制度』）。体言止めと倒置は使わない。カット割りは意味の切れ目に合わせ、証拠→解釈→問いの三拍子の各拍（20〜30秒）ごとに画を替え、短い断定文のところだけ画を長めに留めて言葉を聞かせる。
  humor: 笑わせにいかない。あるのは乾いた皮肉だけで、1本に2〜3回。型は①落差の指摘（『自分のことなら職を決めるだけでも迷うくせに』）、②権威への軽い突っ込み（『人間の尊厳を守ろうとした哲学者が、結婚には随分窮屈な条件を求めたものだ』）、③素っ気ない事実の並置（『役所が求めているのは色気の一切ない2文字の義務に過ぎない』）。突っ込んだ直後に必ず『だが、だからと言って〜を笑うことはできない』とフォローして、嘲笑で終わらせない。ツッコミ語、擬音、ネットスラング、絵文字的な誇張表現は使わない。
  signature_phrases:
  - 〜と納得するのはあまりに早計だ
  - なるほど。確かに一理ある仮説だ。だがそれだけで〜と説明できた気になるのはあまりに気が早い
  - 〜に過ぎないのだ
  - 今回は〈現象〉を手がかりに、我々が〈制度〉に縛られ続ける理由を解剖してみよう
  - だとすれば、我々が〜たいものとは一体何なのだろうか
  avoid:
  - 『ヤバい』『衝撃』『驚愕の真実』『誰も教えてくれない』などの煽り語と、視聴者を試す挑発（この動画では数値の意外性そのものを煽り文句なしで置いている）
  - 『〜すべきだ』『〜は間違っている』という行動・道徳の断定。制度の機能は言い切るが、視聴者の選択には指図しない
  - 当事者（実名の人物）への人格批判・嘲笑。素材として扱い、評価しない
  - 専門用語の投げっぱなし（定義なしの『社会生物学的に』『進化心理学では』等）
  - 『皆さんはどう思いますか』『コメントで教えてください』『チャンネル登録』などの呼びかけ・導線
  - 『私の経験では』『個人的には』という一人称の体験・意見の混入
  - 『実は』『驚くべきことに』の多用（この書き手は1本で1〜2回に絞り、残りは事実の提示だけで驚かせる）
  - 箇条書き的な『ポイントは3つです』という列挙の宣言（数で括る時も文章のまま『この3つの営み』と流す）
  - 感動的な着地（『やはり愛が大切なのです』型のまとめ）
  section_shape: 5〜6ブロック、1ブロック3〜4分。各ブロックは必ず〈証拠 → 早合点の否定 → 一段深い解釈 → 次への問い〉の4拍で閉じる。全体の並びは①時事の入口と問いの提示（一夫一婦の何が揺らいでいるか）→②実証データ（人間のDNA研究で建前を崩す）→③動物・身体（プレーリーハタネズミ、チンパンジーとゴリラの精巣サイズで『共同生活』と『生殖の独占』を分離する）→④社会・経済の起源（治安維持仮説、エンゲルスの相続論で制度の目的を置き換える）→⑤現行制度（民法・戸籍・婚姻届で現在に接続）→⑥哲学（カントの所有論で『性欲の寿命が切れた後に何が残るか』へ落とす）。①で立てた3つの要素（共同生活の維持／性の独占／子の養育）を以後のブロックで1つずつ剥がしていき、最後にその3つが元々別システムだったと合流させる。分野は『データ→生物→歴史→法→哲学』と抽象度が上がる順に並べ、戻らない。
  title_patterns:
  - 〈制度・常識〉はなぜ〈不自然な条件〉なのか｜〈分野A〉と〈分野B〉から解剖する
  - 〈時事の出来事〉が暴いた、〈当たり前の制度〉の本当の目的
  - なぜ〈対象〉は1人でなくてはならないのか
  - 〈制度〉は〈世間が思う目的〉のための仕組みではなかった
  - 〈数字〉％の〈事実〉が示す、〈制度〉のもろさ
  what_makes_it_work: ①入口が『炎上した他人の話』で、出口が『我々自身の制度』になっている。個人を裁く話だと思って入った視聴者が、いつの間にか自分の前提を解剖されている。②毎回、視聴者が出しそうな安易な結論を先回りして潰す（『案外守る生き物なのだと納得するのは早計だ』『それだけで説明できた気になるのは気が早い』）。これで反論が生まれる前に一段深い場所へ連れていける。③分野を跨ぐたびに同じ問い（『共同生活と生殖の独占は同じものか』）を持ち歩くので、情報量が多くても迷子にならない。④数字を出したら必ず『それは何を測った数字か』を限定し直すので、誇張していないという信頼が積み上がる。⑤断定の語尾（『〜に過ぎないのだ』）で切れ味を出しつつ、対象への価値判断は一切下さないため、強い口調なのに説教に聞こえない。
  what_not_to_copy: ①冒頭のヒカル／オープンマリッジ公表と離婚という具体的時事は、この回のためのフックであり、実在の個人の私生活に踏み込む構成。別テーマで踏襲するなら、当事者を評価対象にせず『矛盾を言語化してしまった証人』として最小限に扱える題材かを先に確認すること。人物名をフックにすること自体を定型化しない。②研究データ（1世代1%／19世紀末6%、500年分の家系図）や研究者名は、この回に固有の実在の出典。同じ言い回しで別の数字を当てはめると、存在しない研究を語ることになる。数字は必ず自分で出典を確認したものだけを使う。③結婚・性という領域だからこそ成立している『精巣サイズ』『寝室の秘密』といった身体的・性的な描写。他テーマにそのまま持ち込むと、単に下世話になる。④カントの所有論のような、要約すると誤解を招きやすい古典解釈。この回は『随分窮屈な条件を求めたものだ』と一度突き放してバランスを取っているが、原典を読まずに同じ断定調で要約するのは危険。⑤『我々』で人類全体を代表する話法は、生物学的普遍性を扱うこの回だから成立する。地域・時代・文化で差の大きいテーマでは、同じ『我々』が雑な一般化になる。
