# ============================================================
#  目標 — 数字で追うための設定（ytecon goal が読む）
# ============================================================
# 11/19 から 12 月末までの目標は「本編 1 本あたり平均 500 回」（11/19 にユーザーと決めた）。
# Shorts は数字が伸びていないので当てにしない（目標に入れない。本数はそのまま）。
# 本編の平均は、公開から rules.long.min_age_days 日たった本編の、新しいほうから 7 本の「公開からの通算再生」。
# 前の目標（10 月末: 登録者 100・本編 500 時間・Shorts 平均 1 万）は届かなかった:
#   10/31 時点で 再生 14.2 万 / 登録者 59（11/18）/ 本編の総再生時間 125 時間 / Shorts 平均 約 650 回
# 進捗は YouTube Analytics（無ければ Data API の公開統計）から取り、打ち手を出す。数字は毎回 output/goal/ に残す。

goal:
  name: "12月末: 本編 1 本あたり平均 500 回"
  start: 2026-11-19
  days: 43                   # 2026-12-31 まで
  # 再生の合計は目安（10 月末の 1 日 約 2,900 回のまま 43 日）。目標は下の targets
  views: 125000
  mix: {shorts: 0.85, long: 0.15}
  per_day: {long: 1, shorts: 6}

# 期限（上の start + days）までに届かせたい数字
targets:
  long_avg_views: 500          # 本編 1 本の平均再生（公開 7 日以上の新しい 7 本・通算）
  subscribers: 100

# YouTube パートナープログラムの条件（2025 年時点の一般的な要件。変わったらここを直す）
ypp:
  subscribers: 1000
  watch_hours_12m: 4000        # 公開長尺の総再生時間（Shorts の再生時間は含まれない）
  shorts_views_90d: 10000000   # 上の代わりに、直近 90 日の Shorts 再生 1,000 万でも可

# 週ごとの関門（今回は 1 本ごとの平均が目標なので置かない）
gates: []

# 1 本ごとの合否ライン。下回った動画は打ち手の対象になる
rules:
  long:
    min_age_days: 7            # 本編の平均に入れるのは公開から何日たったものか
    avg_view_pct_min: 0.30     # 平均視聴率（尺に対する割合）
    views_7d_min: 500
  shorts:
    avg_view_pct_min: 0.75
    views_3d_min: 500
