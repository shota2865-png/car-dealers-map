# 手動の週間スケジュール。ここに書いた企画は、その日の `ytecon run` で自動選定より先に使われる。
# date を書けばその日だけ、書かなければ順番に消化する。使い終わった企画は履歴と重複判定で自動的に飛ばされる。
# テーマ: 就活・インターンで悩む大学生 × 経済。必ず実在の企業の具体例と公的統計を出す。
queue:
  - date: 2026-09-21
    title: 「初任給30万円」は本当に得なのか。手取りと昇給カーブで見抜く
    angle: 初任給引き上げを打ち出した企業（ファーストリテイリング、メガバンク、大手商社など）を例に、額面と手取り、初任給だけ高くて昇給が鈍い会社と、初任給は普通でも30代で伸びる会社の違いを、賃金カーブと実質賃金で分解する
    horizon: flow
    why_now: 2026年卒の内定式（10月1日）と秋冬インターン募集の時期。初任給の見出しが就活生の判断材料になっている
    audience_hook: インターン先や志望企業を「初任給の額面」で比べている大学生
    key_questions:
      - 初任給30万円の会社と25万円の会社、10年後の差はどうなるか
      - 額面と手取りの差はどこで生まれるか（社会保険料・住民税の2年目問題）
      - 賃金カーブが寝ている会社を、募集要項と有価証券報告書のどこで見分けるか
    sources:
      - {name: 厚生労働省 賃金構造基本統計調査, url: https://www.mhlw.go.jp/toukei/list/chinginkouzou.html}
      - {name: 厚生労働省 毎月勤労統計調査, url: https://www.mhlw.go.jp/toukei/list/30-1.html}
      - {name: 各社の有価証券報告書（平均年間給与・平均年齢）, url: https://disclosure2.edinet-fsa.go.jp/}
  - date: 2026-09-22
    title: インターン先は「値上げできる会社」を選べ。価格決定力で会社を見抜く
    angle: 中小企業庁の価格転嫁の調査、自動車の下請け構造、キーエンスのような高粗利企業を例に、コストを価格に乗せられる会社と飲み込む会社で給料の原資がどう変わるかを説明し、インターンの説明会で聞くべき一言を示す
    horizon: flow
    why_now: 2025年の春闘でも賃上げは中小と大手で差が開いた。価格転嫁の可否が給料の差になっている
    audience_hook: 「業界」で企業を選んでいるが、同じ業界でも給料が全然違う理由が分からない大学生
    key_questions:
      - 価格転嫁率とは何か。5割前後という数字は何を意味するか
      - 高い粗利率の会社はなぜ高い給料を払えるのか（キーエンス、信越化学などの決算の読み方）
      - 説明会で「原材料費の上昇を価格に転嫁できていますか」と聞くとき、何を見ればよいか
    sources:
      - {name: 中小企業庁 価格交渉促進月間 フォローアップ調査, url: https://www.chusho.meti.go.jp/}
      - {name: 連合 春季生活闘争 集計, url: https://www.jtuc-rengo.or.jp/}
      - {name: 各社 決算短信・有価証券報告書, url: https://disclosure2.edinet-fsa.go.jp/}
  - date: 2026-09-23
    title: 大手かベンチャーか。年功賃金とジョブ型を経済学で比べる
    angle: 日本型雇用（年功賃金・終身雇用）が成り立つ経済的な理由と、日立製作所のジョブ型移行、メルカリやリクルートのような成果連動の給与制度を例に、どちらが「自分の市場価値」を高めるかを労働市場の流動性から考える
    horizon: bridge
    why_now: 大手のジョブ型導入と転職市場の拡大が同時に進み、新卒の「最初の会社」の意味が変わりつつある
    audience_hook: 親は大手を勧めるが、ベンチャーのインターンが楽しかった大学生
    key_questions:
      - 年功賃金はなぜ生まれ、なぜ崩れ始めたのか
      - ジョブ型とメンバーシップ型で、20代の給料と経験はどう違うか
      - 転職市場のデータ（求人倍率・年収）から「最初の会社」の選び方はどう変わるか
    sources:
      - {name: リクルートワークス研究所 大卒求人倍率調査, url: https://www.works-i.com/}
      - {name: 厚生労働省 雇用動向調査, url: https://www.mhlw.go.jp/toukei/list/9-23-1.html}
      - {name: 日立製作所 統合報告書, url: https://www.hitachi.co.jp/IR/}
  - date: 2026-09-24
    title: 円安は就活にどう効くのか。輸出企業の最高益と内需企業の値上げ
    angle: トヨタや任天堂のような輸出型企業が円安で利益を伸ばす仕組みと、ニトリや食品メーカーのように輸入コストで苦しむ内需企業の違いを決算の「為替感応度」から説明し、志望業界の追い風・向かい風を自分で判断できるようにする
    horizon: flow
    why_now: 円安が長期化し、業界ごとの業績と賃上げ余力の差がはっきりしてきた
    audience_hook: ニュースで円安と聞くが、自分の志望業界に得なのか損なのか分からない大学生
    key_questions:
      - 円安で得する会社と損する会社はどう分かれるか
      - 為替感応度とは何か。決算説明資料のどこに書いてあるか
      - 円安の追い風は給料に回るのか、それとも株主に回るのか
    sources:
      - {name: 日本銀行 企業物価指数・実質実効為替レート, url: https://www.boj.or.jp/statistics/}
      - {name: 財務省 貿易統計, url: https://www.customs.go.jp/toukei/info/}
      - {name: 各社 決算説明資料, url: https://disclosure2.edinet-fsa.go.jp/}
  - date: 2026-09-25
    title: ボーナスは誰が決めているのか。労働分配率と業績連動の正体
    angle: ソニーグループや日立の業績と賞与の関係、労働分配率の推移、内部留保と株主還元の議論を通して、会社の利益が給料・賞与・配当にどう分けられるかを説明し、賞与の見出しに惑わされない見方を示す
    horizon: bridge
    why_now: 大企業の利益が過去最高を更新する一方で、労働分配率は下がり続けているというデータが出ている
    audience_hook: 「ボーナス6か月分」のような見出しで会社を選びそうになっている大学生
    key_questions:
      - 労働分配率とは何か。日本はなぜ下がっているのか
      - 業績連動賞与は、好況のときと不況のときにどう動くか
      - 内部留保が多い会社は安心なのか、それとも給料に回さない会社なのか
    sources:
      - {name: 財務省 法人企業統計, url: https://www.mof.go.jp/pri/reference/ssc/}
      - {name: 厚生労働省 毎月勤労統計調査（特別集計 賞与）, url: https://www.mhlw.go.jp/toukei/list/30-1.html}
      - {name: 各社 有価証券報告書, url: https://disclosure2.edinet-fsa.go.jp/}
  - date: 2026-09-26
    title: 人手不足の業界は狙い目か罠か。物流・建設・介護の給料はなぜ上がらないのか
    angle: ヤマト運輸や佐川急便の運賃値上げ、建設業の残業規制（2024年問題）、介護報酬の仕組みを例に、需給が逼迫しても給料が上がる業界と上がらない業界の差を、価格を決めているのが市場か制度かで分ける
    horizon: flow
    why_now: 人手不足倒産が過去最多を更新し、就活生は「人手不足＝売り手市場」と単純に考えがち
    audience_hook: 「人手不足の業界なら内定が出やすいし待遇も上がるはず」と考えている大学生
    key_questions:
      - 人手不足なのに給料が上がらない業界はなぜ存在するか
      - 公定価格（介護報酬・診療報酬）の業界と市場価格の業界で何が違うか
      - 人手不足の業界に入るなら、どの職種・どの会社なら待遇が上がるか
    sources:
      - {name: 帝国データバンク 人手不足倒産の動向調査, url: https://www.tdb.co.jp/}
      - {name: 厚生労働省 一般職業紹介状況（有効求人倍率）, url: https://www.mhlw.go.jp/toukei/list/114-1.html}
      - {name: 国土交通省 トラック運送業の標準的な運賃, url: https://www.mlit.go.jp/}
  - date: 2026-09-27
    title: 就活の「売り手市場」はいつまで続くか。氷河期世代と景気循環から読む
    angle: 就職氷河期世代とリーマン・ショック世代に何が起きたかを大卒求人倍率と生涯賃金のデータで振り返り、いまの売り手市場が人口減少による構造的なものなのか、景気循環による一時的なものなのかを分け、インターンや早期選考をどう使うべきかにつなげる
    horizon: stock
    why_now: 大卒求人倍率が高水準で推移する一方、米国では新卒採用の冷え込みが報じられ始めている
    audience_hook: 「今は売り手市場だから大丈夫」と聞くが、自分の代までそれが続くのか不安な大学生
    key_questions:
      - 就職氷河期世代の生涯賃金はどれだけ下がったか
      - いまの売り手市場は人口減少のせいか、景気のせいか
      - 景気が悪化したとき、新卒採用はどの順で絞られるか（業界・企業規模）
    sources:
      - {name: リクルートワークス研究所 大卒求人倍率調査, url: https://www.works-i.com/}
      - {name: 日本銀行 短観（雇用人員判断DI）, url: https://www.boj.or.jp/statistics/tk/}
      - {name: 労働政策研究・研修機構 ユースフル労働統計, url: https://www.jil.go.jp/}
