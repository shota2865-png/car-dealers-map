# 手動の週間スケジュール。ここに書いた企画は、その日の `ytecon run` で自動選定より先に使われる。
# date を書けばその日だけ、書かなければ順番に消化する。使い終わった企画は履歴と重複判定で自動的に飛ばされる。
# コンセプト: 寝る前に聴く 15〜18 分。AI × お金 × 就活。ずんだもん＝ガクチカも貯金もまだ無い大学生。
queue:
  - date: 2026-09-21
    title: ガクチカが無い夜に。「経験」の値段を経済学で考える
    angle: 企業がガクチカで本当に測っているものを人的資本とシグナリング理論で分解し、留学や長期インターンの「経験」に市場がつけている値段と、無い人が今夜からできる小さな積み上げ（記録・一次情報）を、就活の実例と統計で落ち着いて話す
    horizon: flow
    why_now: 秋冬インターンのES提出が始まり、「書くことが無い」で手が止まる学生が増える時期
    audience_hook: 自己啓発本を読んでは挫折し、理想の自分と今の自分の差で眠れない大学生
    key_questions:
      - 企業はガクチカで何を測っているのか（能力か、それとも「やり切った証拠」か）
      - シグナリング理論で見ると、学歴やインターンは何の合図なのか
      - 今夜から始められる、いちばん小さな「証拠づくり」は何か
    sources:
      - {name: リクルート就職みらい研究所 就職白書, url: https://shushokumirai.recruit.co.jp/}
      - {name: 経団連 新卒採用に関するアンケート調査, url: https://www.keidanren.or.jp/}
      - {name: 労働政策研究・研修機構 若年者の就業状況, url: https://www.jil.go.jp/}
  - date: 2026-09-22
    title: AIに仕事を取られる前に、AIに「代わりに悩んでもらう」使い方
    angle: 生成AIが新卒の仕事に与える影響を、事務・コールセンター・プログラミングの求人データと企業の導入事例（メガバンク、コンサル、ソフトバンクなど）で整理し、就活生が今夜からAIを「自己分析とES下書きの相棒」に使う手順を、依存しすぎない線引きと一緒に話す
    horizon: bridge
    why_now: 米国では新卒求人の減少とAI導入が同時に語られ、日本でも初任給引き上げとAI活用宣言を同時に出す企業が増えている
    audience_hook: AIに置き換えられる側になる気がして、でも何を勉強すればいいか分からない大学生
    key_questions:
      - AIで減る仕事と増える仕事は、どのデータで見分けられるか
      - 企業はAIを「人減らし」に使っているのか、「人手不足の穴埋め」に使っているのか
      - 自己分析にAIを使うとき、任せていい部分と自分でやるべき部分はどこか
    sources:
      - {name: 総務省 情報通信白書（生成AIの利用実態）, url: https://www.soumu.go.jp/johotsusintokei/whitepaper/}
      - {name: 厚生労働省 一般職業紹介状況, url: https://www.mhlw.go.jp/toukei/list/114-1.html}
      - {name: 各社 決算説明資料（AI投資・人員計画）, url: https://disclosure2.edinet-fsa.go.jp/}
  - date: 2026-09-23
    title: 貯金ゼロの大学生が、いちばん最初に知っておくべきお金の順番
    angle: 奨学金・アルバイト・初任給の手取りという学生の実際の数字を出発点に、支出の固定費と変動費、緊急資金、そのあとで初めて出てくる投資という順番を、金融庁のデータと新社会人のよくある失敗（リボ払い、サブスクの積み上がり）で穏やかに説明する。個別の商品は勧めない
    horizon: stock
    why_now: 内定後に「お金の勉強をしなきゃ」と焦って投資から入る学生が多く、順番を間違えやすい
    audience_hook: SNSで同世代の投資自慢を見て焦るが、貯金はほぼゼロの大学生
    key_questions:
      - 奨学金は「借金」としてどう扱えばいいのか（返済の仕組みと金利）
      - 初任給の手取りから、最初に確保する順番は何か
      - 投資を始めていい状態とは、数字で言うとどこか
    sources:
      - {name: 金融庁 金融リテラシー調査, url: https://www.fsa.go.jp/}
      - {name: 日本学生支援機構 学生生活調査, url: https://www.jasso.go.jp/}
      - {name: 日本銀行 金融広報中央委員会 家計の金融行動に関する世論調査, url: https://www.shiruporuto.jp/}
  - date: 2026-09-24
    title: 「意識高い系」に疲れた人へ。自己啓発の市場が売っているものの正体
    angle: 自己啓発本・オンラインサロン・資格講座の市場規模と、行動経済学（現在バイアス、目標勾配効果）で、なぜ買った直後が一番やる気で三日で止まるのかを説明し、理想と現実の差を縮めるのではなく「差があっても眠れる」設計（小さな既定値、記録）を提案する
    horizon: stock
    why_now: 就活と資格の勉強が重なる秋は、自己啓発の広告が学生に集中する時期
    audience_hook: 頑張ろうと決めた夜ほど眠れず、翌朝また自分を責めている大学生
    key_questions:
      - 自己啓発の市場は何を売って、何で儲けているのか
      - なぜ人は「買った瞬間」に満足してしまうのか（行動経済学の説明）
      - 理想との差を縮められない夜に、代わりにできる小さなことは何か
    sources:
      - {name: 矢野経済研究所 資格取得・自己啓発市場の調査, url: https://www.yano.co.jp/}
      - {name: 行動経済学の基礎文献（現在バイアス・コミットメント）, url: https://www.jstage.jst.go.jp/}
      - {name: 総務省 社会生活基本調査（学習・自己啓発の時間）, url: https://www.stat.go.jp/data/shakai/}
  - date: 2026-09-25
    title: 銀行・証券・保険はAIで何が変わるのか。金融業界を志望する前に知る構造
    angle: メガバンクの店舗削減と人員計画、ネット証券の手数料ゼロ化、保険の査定へのAI導入を例に、金融業界の収益構造（利ざや・手数料・運用）がどう変わりつつあるかを整理し、「金融＝安定」というイメージを数字で点検する
    horizon: bridge
    why_now: 金融各社が中期経営計画でAI投資と店舗再編を同時に打ち出し、新卒採用の職種構成も変わり始めている
    audience_hook: なんとなく金融を志望しているが、10年後にその仕事があるのか不安な大学生
    key_questions:
      - 銀行はどこで儲けていて、その儲けはAIでどう変わるか
      - 手数料ゼロの証券会社は、何で利益を出しているのか
      - 金融業界で「残る仕事」と「変わる仕事」はどこで分かれるか
    sources:
      - {name: 全国銀行協会 統計資料, url: https://www.zenginkyo.or.jp/stats/}
      - {name: 各社 中期経営計画・決算説明資料, url: https://disclosure2.edinet-fsa.go.jp/}
      - {name: 金融庁 金融行政方針, url: https://www.fsa.go.jp/}
  - date: 2026-09-26
    title: 「普通の会社員」の生涯賃金と、そこにAIと物価がどう効くか
    angle: 大卒・正社員の生涯賃金の平均、企業規模と学歴による差、そこに実質賃金の低下やAIによる職務の変化がどう乗るかを、ユースフル労働統計と賃金構造基本統計で静かにたどり、「普通でも十分に大きい数字だ」という安心と、「順番を間違えなければ守れる」という見通しを渡す
    horizon: stock
    why_now: 年収の見出しに振り回される時期に、生涯という長い物差しで見直す回が要る
    audience_hook: 一発逆転を狙う気力もなく、でも「普通」で足りるのかも分からない大学生
    key_questions:
      - 生涯賃金はいくらで、何で差がつくのか
      - 物価上昇は生涯賃金の実質価値をどれくらい削るのか
      - AIで職務が変わるとき、生涯賃金のカーブはどう動くと考えられているか
    sources:
      - {name: 労働政策研究・研修機構 ユースフル労働統計（生涯賃金）, url: https://www.jil.go.jp/kokunai/statistics/kako/}
      - {name: 厚生労働省 賃金構造基本統計調査, url: https://www.mhlw.go.jp/toukei/list/chinginkouzou.html}
      - {name: 総務省 消費者物価指数, url: https://www.stat.go.jp/data/cpi/}
  - date: 2026-09-27
    title: 眠れない夜の経済学。不安はなぜ夜に大きくなり、朝には小さくなるのか
    angle: 就活・お金・将来の不安が夜に膨らむ理由を、行動経済学（損失回避、確率加重）と睡眠と意思決定の研究で説明し、就職氷河期世代のその後の統計（回復した人の共通点）を添えて、「今夜決めなくていいこと」と「朝にやる一つのこと」に分けて締める
    horizon: stock
    why_now: 週末の夜は翌週の面接やESが頭から離れず、いちばん眠れない層が多い
    audience_hook: 布団の中で将来を考え始めると止まらなくなる大学生
    key_questions:
      - 夜に不安が大きく感じられるのは、経済学と睡眠研究でどう説明されるか
      - 氷河期世代のその後の統計は、何を教えてくれるか
      - 今夜決めなくていいことと、朝にやる一つのことは何か
    sources:
      - {name: 内閣府 就職氷河期世代支援の統計資料, url: https://www5.cao.go.jp/keizai1/hyogaki/}
      - {name: 厚生労働省 健康づくりのための睡眠ガイド, url: https://www.mhlw.go.jp/}
      - {name: 行動経済学の基礎文献（プロスペクト理論）, url: https://www.jstage.jst.go.jp/}
