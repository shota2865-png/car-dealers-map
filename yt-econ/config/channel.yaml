# ============================================================
#  チャンネル設定 — ここを書き換えれば全工程の挙動が変わる
# ============================================================

channel:
  name: "3分で腹落ち経済"          # 仮。お好みで
  # 誰に向けて話すか（台本のトーンを決める最重要パラメータ）
  audience: "高校生・大学生・20代のビジネスパーソン"
  # 守るべき語り口
  tone: |
    - 中学生でも分かる言葉に言い換える。専門用語は必ず初出で1文の言い換えを添える
    - 上から目線で教えない。「一緒に考える」トーン
    - 断定しすぎない。予測は「〜という見方がある」と出典付きで
    - 不安を煽らない。「ヤバい」「終わった」等の煽り表現は使わない
    - 1文は40〜60字。体言止めを多用しない
  # 絶対に扱わない領域（収益化・法令リスク回避）
  banned_topics:
    - 個別銘柄の売買推奨・値上がり予想
    - 「絶対儲かる」「確実に」等の断定的投資助言
    - 特定の個人・企業への誹謗中傷
    - 未確認の陰謀論・出典不明の統計

video:
  target_minutes_min: 8.0
  target_minutes_max: 10.0
  # 日本語ナレーションの体感速度（文字/分）。TTS実測に合わせて調整する
  chars_per_minute: 340
  resolution: [1920, 1080]
  fps: 30
  # 1本あたりの本編セクション数（導入・まとめを除く）
  body_sections: 5

script:
  model: "claude-opus-5"
  effort: "high"
  # 生成後にファクトチェック用の第2パスを走らせる
  fact_check: true
  # 尺が目標レンジから外れたら自動で伸縮リライトする回数
  max_length_repairs: 2

topics:
  model: "claude-opus-5"
  effort: "medium"
  # 1回の収集で何件の候補を評価するか
  fetch_limit: 60
  # 過去何日分の投稿済みトピックと重複チェックするか
  dedupe_window_days: 120
  # 類似度がこれを超えたら重複扱い
  dedupe_threshold: 0.72
  # --- 日本と海外の時差をどう賭けるか -------------------------------
  # 海外で起きたことは日本に遅れて来る。この時差は弱点ではなく在庫。
  #   flow   いま日本で話題。今日の再生を稼ぐ燃料
  #   bridge 海外で起きており日本にも半年以内に来る。先行者として一番おいしい
  #   stock  海外のみ。今は数字が出ないが、日本で話題化した瞬間に掘り起こされる
  # 比率はその日だけで割らず、直近の偏りを見て不足している枠から埋める
  # （1日2本で 3:2:1 をその場で割ると stock が毎日0本になり仕込みが貯まらない）
  horizon_mix:
    flow: 3
    bridge: 2
    stock: 1
  # 直近何日ぶんの実績を見て偏りを判断するか
  horizon_window_days: 30
  # 1回の生成で最低限確保する本数。flow を枯らすとチャンネルが回らなくなる
  horizon_floor:
    flow: 1
  # この本数に達するまでは flow を厚くする（土台が無いと stock も掘られない）
  ramp_up_videos: 30

  # stock / bridge の材料になる「海外で先行している領域」の種。
  # ここを育てるほど先行在庫の質が上がる。半年に一度は見直すこと
  frontier_seeds:
    - "米国で進むステーブルコインの決済利用と、日本の資金決済法"
    - "欧州のAI規制が日本企業の実務に降りてくる経路"
    - "海外で一般化したライドシェア・民泊が日本で遅れた制度的理由"
    - "米国のBNPL（後払い）が生んだ若年層の債務問題"
    - "海外の401k型年金と日本のiDeCo・企業型DCの差"
    - "欧米で進む『修理する権利』と製造業のビジネスモデル"
    - "インドのUPIに見る決済インフラの飛び越え型発展"
    - "米国の学生ローン問題が示す教育投資の採算"
    - "海外で広がる週4日勤務の生産性データ"
    - "中国のEV価格競争が日本の自動車産業に及ぶ経路"
    - "海外の住宅ローン金利上昇が示す、日本の変動金利のリスク"
    - "米国のギグワーカー保護法制と日本の労働法"
  rss_sources:
    - name: "NHK 経済"
      url: "https://www.nhk.or.jp/rss/news/cat5.xml"
    - name: "Yahoo!ニュース 経済"
      url: "https://news.yahoo.co.jp/rss/topics/business.xml"
    - name: "日本銀行 新着"
      url: "https://www.boj.or.jp/rss/whatsnew.xml"
    - name: "IMF Blog"
      url: "https://www.imf.org/en/Blogs/rss"
  # ニュースが取れない日でも枯れない常設テーマの種
  evergreen_seeds:
    - "円安はなぜ起きる？ 生活にどう効いてくるのか"
    - "金利が上がると私たちの財布に何が起きるのか"
    - "インフレとデフレ、結局どっちが困るのか"
    - "GDPって何を測っている数字なのか"
    - "日銀は何をしている組織なのか"
    - "新NISAの仕組みを制度設計から理解する"
    - "年金は本当に破綻するのか、数字で確かめる"
    - "なぜ日本の給料は30年上がらなかったのか"
    - "株価と景気がズレるのはなぜか"
    - "需要と供給の曲線が現実のどこに現れているか"
    - "為替介入は何をしているのか"
    - "国の借金1200兆円をどう捉えるべきか"
    - "最低賃金を上げると雇用は減るのか"
    - "半導体が経済の主役になった理由"
    - "サブスク経済はなぜ強いのか"

tts:
  # voicevox | google
  provider: "voicevox"
  voicevox:
    # 話者ID。1回 `python -m ytecon speakers` で一覧が見られる
    speaker: 13          # 青山龍星 などお好みで
    speed: 1.08
    pitch: 0.0
    intonation: 1.1
    # 文末の無音（秒）
    pause_sentence: 0.28
    pause_section: 0.65
  google:
    voice_name: "ja-JP-Neural2-B"
    speaking_rate: 1.12

visuals:
  # 背景画像の取得元（PEXELS_API_KEY 未設定なら自動で単色/グラデにフォールバック）
  stock_provider: "pexels"
  # 図表の配色
  palette:
    bg: "#0E1525"
    surface: "#18223A"
    text: "#F2F5FA"
    accent: "#4CC2FF"
    accent2: "#FFC857"
    positive: "#5BD99A"
    negative: "#FF6B6B"
  # Ken Burns（ゆっくりズーム）を効かせる
  ken_burns: true
  subtitle:
    font_size: 58
    max_chars_per_line: 20
    outline: 5

render:
  # ffmpeg | capcut
  # ffmpeg = 完全自動で mp4 まで出力（推奨・無人運転できる）
  # capcut = CapCut のドラフトを自動生成し、最後の書き出しだけ手動
  backend: "ffmpeg"
  bgm:
    enabled: true
    # assets/bgm/ に置いた著作権クリアな音源ファイル名（空なら BGM なし）
    file: ""
    volume_db: -26
  capcut:
    # CapCut ドラフト保存先。空なら OS 既定パスを自動判定
    draft_dir: ""

upload:
  # public | unlisted | private
  privacy: "public"
  # JST での投稿時刻。1日2本なので2つ
  publish_times_jst: ["07:30", "19:30"]
  category_id: "25"      # News & Politics（経済解説はここか 27:Education）
  language: "ja"
  playlist_title: "経済ニュースを噛み砕く"
  made_for_kids: false
  # 予約投稿を使う（privacy: public + publishAt）
  schedule: true

# 寝かせた動画の掘り起こし（ytecon revive）
# 企画時に決めた watch_keywords が日本のニュース見出しに出たら、
# タイトル・サムネ・概要欄を作り替えて「いま探されている1本」にする
revive:
  enabled: true
  # --apply なしでも案だけは毎日作る。自動反映は urgency が now/this_week のときだけ
  auto_apply: false
  # 一度掘り起こした動画を、次に再通知するまでの間隔（日）。
  # 1本に監視語を複数持たせるので、これが無いと同じニュースで何度も鳴る
  cooldown_days: 45

pipeline:
  videos_per_day: 2
  workdir: "output"
  # 失敗時のリトライ回数
  retries: 2
