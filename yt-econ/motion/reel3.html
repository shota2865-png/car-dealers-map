<script type="module">
// PSYCH DATA LAB サンプル v3（1440p）— 「選択肢が多いと、選べない？」をデータで検証する。
//   データはすべて立体: 1% ずつ積み上がる棒（データの積み木）、100 人の流れで見せる計算、50 の実験の分布（模式図）、条件の柱。
//   背景は神経細胞の星空ドーム（プラネタリウム）、最後は 4D のテッセラクトとロゴの輪。
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const _q = new URLSearchParams(location.search), W = +(_q.get('w') || 2560), H = +(_q.get('h') || 1440);   // ?w=640&h=360 で位置だけ速く測る
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020409);
scene.fog = new THREE.FogExp2(0x020409, 0.018);
const cam = new THREE.PerspectiveCamera(50, W / H, 0.02, 400);
scene.add(new THREE.AmbientLight(0x4a6a8a, 1.0));
const keyL = new THREE.PointLight(0x22d3ee, 22, 40, 1.6); scene.add(keyL);
const rimL = new THREE.PointLight(0xff3d9a, 14, 40, 1.6); scene.add(rimL);
const topL = new THREE.DirectionalLight(0xbfe9ff, 1.2); topL.position.set(2, 8, 4); scene.add(topL);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.5, 0.3); composer.addPass(bloom);
const lensPass = new ShaderPass({
  uniforms: {tDiffuse: {value: null}, fish: {value: 0.25}, ca: {value: 0.0016}, aspect: {value: W / H}},
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float fish, ca, aspect; varying vec2 vUv;
    vec2 lens(vec2 uv, float k){ vec2 p = (uv - 0.5) * vec2(aspect, 1.0); float r = length(p); float f = 1.0 / (1.0 + k * 1.04);
      float rr = r * (1.0 + k * r * r) * f; p = (r > 0.0 ? p / r * rr : p); return p / vec2(aspect, 1.0) + 0.5; }
    void main(){ vec3 c = vec3(texture2D(tDiffuse, lens(vUv, fish * (1.0 + ca * 40.0))).r, texture2D(tDiffuse, lens(vUv, fish)).g, texture2D(tDiffuse, lens(vUv, fish * (1.0 - ca * 40.0))).b);
      vec2 q = (vUv - 0.5) * vec2(aspect, 1.0); c *= smoothstep(1.3, 0.3, length(q)); gl_FragColor = vec4(c, 1.0); }`
});
composer.addPass(lensPass); composer.addPass(new OutputPass());

let seed = 21;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd());
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, f = 0.8) => seg(t, a, a + f) * (1 - seg(t, b - f, b));
const CYAN = new THREE.Color(0x22d3ee), MAG = new THREE.Color(0xff3d9a), VIO = new THREE.Color(0x7c5cff),
      TEAL = new THREE.Color(0x2ff5c8), GOLD = new THREE.Color(0xffc857), WHITE = new THREE.Color(0xeaf6ff), DIM = new THREE.Color(0x2a4a6a);
function dotTex() { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const DOT = dotTex();
const pmat = (size, opacity = 1, fog = true) => new THREE.PointsMaterial({size, map: DOT, vertexColors: true, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending, fog});
function pointCloud(n, fill, size, opacity = 1, fog = true) {
  const g = new THREE.BufferGeometry(), p = new Float32Array(n * 3), c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const [x, y, z, col, v] = fill(i); p.set([x, y, z], i * 3); c.set([col.r * v, col.g * v, col.b * v], i * 3); }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(c, 3)); return new THREE.Points(g, pmat(size, opacity, fog));
}
const onSphere = () => { const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u); return [s * Math.cos(th), u, s * Math.sin(th)]; };
const tmp = new THREE.Vector3();
function project(v) { tmp.copy(v).project(cam); return [Math.round((tmp.x + 1) / 2 * W), Math.round((1 - tmp.y) / 2 * H), tmp.z < 1 ? 1 : 0]; }
const fadeMats = new Map();       // 場面ごとに透明度を一括で変える
function track(group, key) { group.traverse(o => { if (o.material) { (fadeMats.get(key) || fadeMats.set(key, []).get(key)).push([o.material, o.material.opacity]); o.material.transparent = true; } }); }
function setFade(key, k, grp) { (fadeMats.get(key) || []).forEach(([m, o]) => { m.opacity = o * k; }); if (grp) grp.visible = k > 0.01; }

// ---------- 共通の舞台: 星空ドーム（いつも背景に）と床 ----------
const dome = new THREE.Group(); scene.add(dome);
const domePts = pointCloud(30000, () => { const [x, y, z] = onSphere(); const r = 60 * (0.8 + rnd() * 0.4); return [x * r, y * r, z * r, rnd() < .62 ? CYAN : (rnd() < .5 ? VIO : MAG), 0.3 + rnd() * 0.7]; }, 0.5, 0.95, false);
dome.add(domePts);
const band = pointCloud(16000, () => { const a = rnd() * Math.PI * 2, w = (rnd() - .5) * (rnd() < .5 ? 4 : 12), r = 55;
  const v = new THREE.Vector3(Math.cos(a) * r, w, Math.sin(a) * r).applyAxisAngle(new THREE.Vector3(1, 0, 0.3).normalize(), 0.9); return [v.x, v.y, v.z, rnd() < .5 ? MAG : VIO, 0.25 + rnd() * 0.5]; }, 0.38, 0.9, false);
dome.add(band);
const floor = new THREE.Group(); scene.add(floor);
const grid = new THREE.GridHelper(80, 160, 0x22d3ee, 0x0b3446); grid.material.transparent = true; grid.material.opacity = 0.55; floor.add(grid);
const disc = new THREE.Mesh(new THREE.CircleGeometry(9, 96), new THREE.MeshStandardMaterial({color: 0x061826, metalness: 0.3, roughness: 0.8, transparent: true, opacity: 0.85}));
disc.rotation.x = -Math.PI / 2; disc.position.y = 0.002; floor.add(disc);
const ringFloor = new THREE.Mesh(new THREE.RingGeometry(8.9, 9.0, 160), new THREE.MeshBasicMaterial({color: 0x22d3ee, transparent: true, opacity: 0.8, side: THREE.DoubleSide}));
ringFloor.rotation.x = -Math.PI / 2; ringFloor.position.y = 0.004; floor.add(ringFloor);
track(floor, 'floor');

// ---------- 1) データの積み木の棒グラフ（1% = 1 段） ----------
function voxelBar(color, layers, x) {
  const g = new THREE.Group(); g.position.x = x;
  const slabGeo = new THREE.BoxGeometry(1.6, 0.06, 1.6);
  const mat = new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: 0.28, metalness: 0.3, roughness: 0.35, transparent: true, opacity: 0.82});
  const inst = new THREE.InstancedMesh(slabGeo, mat, 100); inst.count = 0; g.add(inst);
  const edgeMat = new THREE.LineBasicMaterial({color: 0xeaf6ff, transparent: true, opacity: 0.95});
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.64, 1, 1.64)), edgeMat); edges.position.y = 0.5; g.add(edges);
  g.userData = {inst, edges, layers, mat}; return g;
}
const m4 = new THREE.Matrix4(), q0 = new THREE.Quaternion(), s1 = new THREE.Vector3(1, 1, 1);
function setBar(bar, value, t0, t, dur = 2.4) {
  const n = Math.round(value * easeOut(seg(t, t0, t0 + dur)));
  const {inst, edges} = bar.userData; inst.count = n;
  for (let i = 0; i < n; i++) { m4.compose(new THREE.Vector3(0, 0.03 + i * 0.07, 0), q0, s1); inst.setMatrixAt(i, m4); }
  inst.instanceMatrix.needsUpdate = true;
  const h = Math.max(0.001, n * 0.07); edges.scale.y = h; edges.position.y = h / 2;
  return h;
}
const bars1 = new THREE.Group(); scene.add(bars1);
const b24 = voxelBar(0x22d3ee, 60, -2.2), b6 = voxelBar(0x7c5cff, 40, 2.2); bars1.add(b24, b6); track(bars1, 'bars1');
const bars2 = new THREE.Group(); scene.add(bars2);
const p24 = voxelBar(0x3c6f96, 3, -2.2), p6 = voxelBar(0xffc857, 30, 2.2); bars2.add(p24, p6);
// 棒のまわりに 100 人（立ち止まった人）。買った人だけ金色
const body = new THREE.CylinderGeometry(0.045, 0.06, 0.2, 8); body.translate(0, 0.1, 0);
const head = new THREE.SphereGeometry(0.045, 10, 10); head.translate(0, 0.26, 0);
const personGeo = BufferGeometryUtils.mergeGeometries([body, head]);
function ringPeople(cx, bought) {
  const mesh = new THREE.InstancedMesh(personGeo, new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0x111111, roughness: 0.5, transparent: true, opacity: 0.95}), 100);
  const col = new THREE.Color();
  for (let i = 0; i < 100; i++) { const a = i / 100 * Math.PI * 2, r = 1.55 + (i % 2) * 0.28; m4.compose(new THREE.Vector3(cx + Math.cos(a) * r, 0, Math.sin(a) * r), q0, s1); mesh.setMatrixAt(i, m4); mesh.setColorAt(i, col.set(0x4a7aa8)); }
  mesh.userData = {bought: new Set(Array.from({length: bought}, (_, k) => Math.floor(k * 100 / bought)))}; return mesh;
}
const ppl24 = ringPeople(-2.2, 3), ppl6 = ringPeople(2.2, 30); bars2.add(ppl24, ppl6); track(bars2, 'bars2');

// ---------- 2) 100 人の流れ（通りかかる → 立ち止まる → 買う） ----------
const funnel = new THREE.Group(); scene.add(funnel);
const levels = [4.2, 2.3, 0.4];
function funnelRings(cx, color) {
  const g = new THREE.Group();
  [[1.6, levels[0]], [1.2, levels[1]], [0.6, levels[2]]].forEach(([r, y]) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, 0.02, 8, 120), new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.9})); m.rotation.x = Math.PI / 2; m.position.set(cx, y, 0); g.add(m);
    const f = new THREE.Mesh(new THREE.CircleGeometry(r, 64), new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false})); f.rotation.x = -Math.PI / 2; f.position.set(cx, y, 0); g.add(f);
  });
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 0.6, levels[0] - levels[2], 64, 1, true), new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false, wireframe: true}));
  cone.position.set(cx, (levels[0] + levels[2]) / 2, 0); g.add(cone);
  return g;
}
funnel.add(funnelRings(-2.6, 0x22d3ee), funnelRings(2.6, 0x7c5cff));
const flowN = 200, flowGeo = new THREE.BufferGeometry(), flowPos = new Float32Array(flowN * 3), flowCol = new Float32Array(flowN * 3), flowP = [];
for (let i = 0; i < flowN; i++) {
  const left = i < 100, k = i % 100, stopN = left ? 60 : 40, buyN = left ? 2 : 12;
  const stage = k < buyN ? 2 : (k < stopN ? 1 : 0);   // 0 = 通り過ぎる / 1 = 立ち止まる / 2 = 買う
  flowP.push({left, stage, a: rnd() * Math.PI * 2, r: 0.2 + rnd() * 1.3, d: rnd() * 1.2, out: (rnd() - 0.5) * 2});
}
flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3)); flowGeo.setAttribute('color', new THREE.BufferAttribute(flowCol, 3));
const flowPts = new THREE.Points(flowGeo, pmat(0.22, 1)); funnel.add(flowPts); track(funnel, 'funnel');

// ---------- 3) 50 の実験の分布（模式図。平均はほぼ 0） ----------
const meta = new THREE.Group(); scene.add(meta);
const axis = new THREE.Mesh(new THREE.BoxGeometry(12, 0.02, 0.02), new THREE.MeshBasicMaterial({color: 0x8fb3cc, transparent: true, opacity: 0.9})); axis.position.y = 0.01; meta.add(axis);
const zeroPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.04 * 0 + 9, 4), new THREE.MeshBasicMaterial({color: 0x22d3ee, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false}));
zeroPlane.rotation.y = Math.PI / 2; zeroPlane.position.set(0, 2, -1.5); meta.add(zeroPlane);
const zeroEdge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(9, 4)), new THREE.LineBasicMaterial({color: 0x22d3ee, transparent: true, opacity: 0.8}));
zeroEdge.rotation.y = Math.PI / 2; zeroEdge.position.copy(zeroPlane.position); meta.add(zeroEdge);
const studies = [];
for (let i = 0; i < 50; i++) {
  const eff = 0.02 + gauss() * 0.42, se = 0.12 + rnd() * 0.25, z = -i * 0.18 + 2.0;
  const col = eff > 0.15 ? new THREE.Color(0xffc857) : (eff < -0.15 ? new THREE.Color(0x22d3ee) : new THREE.Color(0xeaf6ff));
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), new THREE.MeshStandardMaterial({color: col, emissive: col, emissiveIntensity: 0.7, transparent: true, opacity: 0.95}));
  s.position.set(eff * 4, 0.6 + (i % 5) * 0.55, z); meta.add(s);
  const ci = new THREE.Mesh(new THREE.BoxGeometry(se * 8, 0.015, 0.015), new THREE.MeshBasicMaterial({color: col, transparent: true, opacity: 0.6})); ci.position.copy(s.position); meta.add(ci);
  studies.push({s, ci, y: s.position.y});
}
const meanD = new THREE.Mesh(new THREE.OctahedronGeometry(0.28), new THREE.MeshStandardMaterial({color: 0xff3d9a, emissive: 0xff3d9a, emissiveIntensity: 0.9, transparent: true, opacity: 1}));
meanD.position.set(0.02 * 4, 3.6, 0); meta.add(meanD); track(meta, 'meta');

// ---------- 4) 効いてくる条件（4 本の柱） ----------
const conds = new THREE.Group(); scene.add(conds);
const pillars = [];
for (let k = 0; k < 4; k++) {
  const a = -Math.PI / 2 + k * Math.PI / 2 + Math.PI / 4, x = Math.cos(a) * 3.2, z = Math.sin(a) * 3.2;
  const col = [0x22d3ee, 0x7c5cff, 0xff3d9a, 0xffc857][k];
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1, 6, 1), new THREE.MeshStandardMaterial({color: col, emissive: col, emissiveIntensity: 0.5, metalness: 0.5, roughness: 0.2, transparent: true, opacity: 0.85}));
  p.geometry.translate(0, 0.5, 0); p.position.set(x, 0, z); conds.add(p);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.015, 8, 80), new THREE.MeshBasicMaterial({color: col, transparent: true, opacity: 0.9})); halo.rotation.x = Math.PI / 2; halo.position.set(x, 0.02, z); conds.add(halo);
  pillars.push({p, halo, x, z});
}
const coreC = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8, 2), new THREE.MeshStandardMaterial({color: 0xeaf6ff, emissive: 0x22d3ee, emissiveIntensity: 0.6, wireframe: true, transparent: true, opacity: 0.8}));
coreC.position.y = 1.6; conds.add(coreC); track(conds, 'conds');

// ---------- 5) 4D のテッセラクト（検証結果の背景） ----------
const four = new THREE.Group(); scene.add(four);
const tv = []; for (let i = 0; i < 16; i++) tv.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1, (i & 8) ? 1 : -1]);
const te = []; for (let i = 0; i < 16; i++) for (let b = 0; b < 4; b++) { const j = i ^ (1 << b); if (j > i) te.push([i, j]); }
const SUB = 24, tessGeo = new THREE.BufferGeometry(), tessPos = new Float32Array(te.length * SUB * 6), tessCol = new Float32Array(te.length * SUB * 6);
te.forEach(([a, b], k) => { const c = (tv[a][3] + tv[b][3]) > 0 ? MAG : CYAN; for (let s = 0; s < SUB; s++) tessCol.set([c.r, c.g, c.b, c.r, c.g, c.b], (k * SUB + s) * 6); });
tessGeo.setAttribute('position', new THREE.BufferAttribute(tessPos, 3)); tessGeo.setAttribute('color', new THREE.BufferAttribute(tessCol, 3));
four.add(new THREE.LineSegments(tessGeo, new THREE.LineBasicMaterial({vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false})));
track(four, 'four');
function rot4(p, a, b, c) { let [x, y, z, w] = p; let ca = Math.cos(a), sa = Math.sin(a); [x, w] = [x * ca - w * sa, x * sa + w * ca];
  let cb = Math.cos(b), sb = Math.sin(b); [y, w] = [y * cb - w * sb, y * sb + w * cb]; let cc = Math.cos(c), sc = Math.sin(c); [z, w] = [z * cc - w * sc, z * sc + w * cc]; return [x, y, z, w]; }

  const p = tv[i].map((v, n) => lerp(v, tv[j][n], f)); const r = rot4(p, t * 0.55, t * 0.37, t * 0.21); const k = 3.4 / (3.2 - r[3]);
  tessPos[o++] = r[0] * k; tessPos[o++] = r[1] * k + 2.2; tessPos[o++] = r[2] * k; } }); tessGeo.attributes.position.needsUpdate = true; }

// ---------- 6) ロゴの輪 ----------
const ringN = 22000, ringGeo = new THREE.BufferGeometry(), ringPos = new Float32Array(ringN * 3), ringCol = new Float32Array(ringN * 3), ringFrom = new Float32Array(ringN * 3), ringA = new Float32Array(ringN);
for (let i = 0; i < ringN; i++) { const [x, y, z] = onSphere(), r = 20 + rnd() * 30; ringFrom.set([x * r, y * r, z * r], i * 3); ringA[i] = rnd();
  const c = rnd() < .65 ? CYAN : (rnd() < .5 ? MAG : VIO), v = .4 + rnd() * .6; ringCol.set([c.r * v, c.g * v, c.b * v], i * 3); }
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3)); ringGeo.setAttribute('color', new THREE.BufferAttribute(ringCol, 3));
const ringMat = pmat(0.045, 0); const logoRing = new THREE.Points(ringGeo, ringMat); scene.add(logoRing);

// ======================================================================
const T = {s0: [0, 11], s1: [11, 23], s2: [23, 33], s3: [33, 44], s4: [44, 54], s5: [54, 64], s6: [64, 71.5], s7: [71.5, 78]};
window.renderAt = (t) => {
  const out = {};
  dome.rotation.y = t * 0.02;
  domePts.material.opacity = t < 11 ? 0.95 : 0.55; band.material.opacity = t < 11 ? 0.85 : 0.45;
  const floorK = win(t, 10.6, 71.6, 1.0); setFade('floor', floorK, floor);
  keyL.position.set(Math.sin(t * 0.4) * 6, 5, Math.cos(t * 0.4) * 6); rimL.position.set(-Math.sin(t * 0.3) * 6, 3, -Math.cos(t * 0.3) * 6);
  let fish = 0.22;
  // ---- カメラ ----
  if (t < 11) { const k = ease(seg(t, 0, 11)); cam.position.set(0, 1.5, 0); cam.fov = lerp(92, 78, k); fish = 0.5; cam.lookAt(Math.sin(t * 0.08) * 10, lerp(2, 16, k), -20); }
  else if (t < 33) { const k = seg(t, 11, 33), a = -0.55 + k * 0.9; cam.position.set(Math.sin(a) * 12.5, lerp(3.6, 4.4, k), Math.cos(a) * 12.5); cam.fov = 44; cam.lookAt(0, 2.0, 0); }
  else if (t < 44) { const k = seg(t, 33, 44), a = -0.35 + k * 0.6; cam.position.set(Math.sin(a) * 11.5 + 1.3, 4.6, Math.cos(a) * 11.5); cam.fov = 46; cam.lookAt(1.3, 2.3, 0); }
  else if (t < 54) { const k = seg(t, 44, 54); cam.position.set(lerp(-6.5, 5.5, ease(k)), lerp(4.8, 3.6, k), lerp(9.5, 8.5, k)); cam.fov = 48; cam.lookAt(0, 2.0, -1.0); }
  else if (t < 64) { const k = seg(t, 54, 64), a = k * 1.4 - 0.4; cam.position.set(Math.sin(a) * 9, lerp(6.5, 4.0, ease(k)), Math.cos(a) * 9); cam.fov = 48; cam.lookAt(0, 1.6, 0); }
  else if (t < 71.6) { const k = seg(t, 64, 71.6), a = k * 0.8; cam.position.set(Math.sin(a) * 7.0, 2.4, Math.cos(a) * 7.0); cam.fov = 50; cam.lookAt(-1.0, 2.2, 0); }
  else { const k = ease(seg(t, 71.6, 74.5)); cam.position.set(0, 0, lerp(14, 7.2, k)); cam.fov = 50; cam.lookAt(0, 0, 0); fish = lerp(0.5, 0.2, k); }
  cam.updateProjectionMatrix(); cam.updateMatrixWorld(); lensPass.uniforms.fish.value = fish;   // 先にカメラを決めてから、3D の点を画面に写す

  // ---- s1: 立ち止まった人 60% vs 40% ----
  const k1 = win(t, ...T.s1, 0.8); setFade('bars1', k1, bars1);
  if (bars1.visible) {
    const h24 = setBar(b24, 60, 14.6, t), h6 = setBar(b6, 40, 18.6, t);
    out.b24 = project(new THREE.Vector3(-2.2, h24 + 0.25, 0)); out.b6 = project(new THREE.Vector3(2.2, h6 + 0.25, 0));
    out.b24base = project(new THREE.Vector3(-2.2, 0, 1.2)); out.b6base = project(new THREE.Vector3(2.2, 0, 1.2));
    out.v24 = Math.round(60 * easeOut(seg(t, 14.6, 17.0))); out.v6 = Math.round(40 * easeOut(seg(t, 18.6, 21.0)));
  }
  // ---- s2: 買った人 3% vs 30% ----
  const k2 = win(t, ...T.s2, 0.8); setFade('bars2', k2, bars2);
  if (bars2.visible) {
    const h24 = setBar(p24, 3, 25.6, t, 1.2), h6 = setBar(p6, 30, 27.4, t, 2.0);
    [[ppl24, 25.6], [ppl6, 27.4]].forEach(([m, t0]) => { const c = new THREE.Color(); for (let i = 0; i < 100; i++) { const lit = m.userData.bought.has(i) && t > t0 + (i / 100) * 1.4; m.setColorAt(i, c.set(lit ? 0xffc857 : 0x4a7aa8)); } m.instanceColor.needsUpdate = true; });
    out.p24 = project(new THREE.Vector3(-2.2, Math.max(h24, 0.2) + 0.25, 0)); out.p6 = project(new THREE.Vector3(2.2, h6 + 0.25, 0));
    out.p24base = project(new THREE.Vector3(-2.2, 0, 2.2)); out.p6base = project(new THREE.Vector3(2.2, 0, 2.2));
    out.w24 = Math.round(3 * easeOut(seg(t, 25.6, 26.8))); out.w6 = Math.round(30 * easeOut(seg(t, 27.4, 29.4)));
  }
  // ---- s3: 100 人の流れ ----
  const k3 = win(t, ...T.s3, 0.8); setFade('funnel', k3, funnel);
  if (funnel.visible) {
    flowP.forEach((p, i) => {
      const cx = p.left ? -2.6 : 2.6, tt = t - 34.5 - p.d;
      let x, y, z, c;
      const a = p.a + t * 0.6;
      if (tt < 0) { x = cx + Math.cos(a) * p.r * 1.1; y = levels[0] + 0.6 + Math.sin(t * 2 + i) * 0.05; z = Math.sin(a) * p.r * 1.1; c = WHITE; }
      else {
        const f1 = easeOut(seg(tt, 0, 1.6)), f2 = easeOut(seg(tt, 2.6, 4.2));
        if (p.stage === 0) { const away = easeOut(seg(tt, 0.4, 2.6)); x = cx + Math.cos(a) * p.r + p.out * 3 * away; y = lerp(levels[0] + 0.6, levels[0] - 0.4, away); z = Math.sin(a) * p.r + 2.5 * away; c = DIM; }
        else { const r1 = lerp(p.r, p.r * 0.75, f1), r2 = p.stage === 2 ? lerp(r1, 0.35, f2) : r1;
          y = lerp(levels[0] + 0.6, levels[1] + 0.1, f1); if (p.stage === 2) y = lerp(y, levels[2] + 0.1, f2);
          x = cx + Math.cos(a) * r2; z = Math.sin(a) * r2; c = p.stage === 2 && f2 > 0.6 ? GOLD : (p.left ? CYAN : VIO); }
      }
      flowPos.set([x, y, z], i * 3); flowCol.set([c.r, c.g, c.b], i * 3);
    });
    flowGeo.attributes.position.needsUpdate = true; flowGeo.attributes.color.needsUpdate = true;
    ['L', 'R'].forEach((s, si) => levels.forEach((y, li) => { out[`lv${s}${li}`] = project(new THREE.Vector3(si ? 2.6 + 1.9 : -2.6 - 1.9, y, 0)); }));
  }
  // ---- s4: 50 の実験 ----
  const k4 = win(t, ...T.s4, 0.8); setFade('meta', k4, meta);
  if (meta.visible) {
    studies.forEach((st, i) => { const a = easeOut(seg(t, 45.2 + i * 0.06, 46.0 + i * 0.06)); st.s.scale.setScalar(Math.max(0.001, a)); st.ci.scale.set(Math.max(0.001, a), 1, 1); st.s.position.y = st.y + (1 - a) * 3; st.ci.position.y = st.s.position.y; });
    const md = easeOut(seg(t, 49.4, 50.6)); meanD.scale.setScalar(Math.max(0.001, md)); meanD.rotation.y = t * 1.5; meanD.position.y = lerp(5.5, 3.6, md);
    out.mean = project(meanD.position.clone().add(new THREE.Vector3(0, 0.5, 0)));
    out.axL = project(new THREE.Vector3(-5.6, 0, 2.4)); out.axR = project(new THREE.Vector3(5.6, 0, 2.4)); out.zero = project(new THREE.Vector3(0, 4.2, -1.5));
  }
  // ---- s5: 条件の柱 ----
  const k5 = win(t, ...T.s5, 0.8); setFade('conds', k5, conds);
  if (conds.visible) {
    pillars.forEach((pl, k) => { const g = easeOut(seg(t, 56.0 + k * 1.1, 57.2 + k * 1.1)); pl.p.scale.set(1, 0.001 + 2.6 * g, 1); pl.halo.scale.setScalar(1 + 0.15 * Math.sin(t * 4 + k)); out[`c${k}`] = project(new THREE.Vector3(pl.x, 2.6 * g + 0.5, pl.z)); });
    coreC.rotation.set(t * 0.3, t * 0.5, 0);
  }
  // ---- s6: 4D ----
  const k6 = win(t, 63.6, 72.0, 0.8); setFade('four', k6, four); if (four.visible) updateFour(t);
  // ---- s7: ロゴの輪 ----
  const rk = seg(t, 71.2, 72.2); logoRing.visible = rk > 0.01; ringMat.opacity = rk * (1 - seg(t, 77.2, 78));
  if (logoRing.visible) { for (let i = 0; i < ringN; i++) { const k = ease(seg(t, 71.6 + ringA[i] * 1.6, 73.6 + ringA[i] * 1.6)), a = i * 2.399963 + t * 0.3, rr = 2.2 + Math.sin(i * 12.9898) * 0.12;
    ringPos[i * 3] = lerp(ringFrom[i * 3], Math.cos(a) * rr, k); ringPos[i * 3 + 1] = lerp(ringFrom[i * 3 + 1], Math.sin(a) * rr, k); ringPos[i * 3 + 2] = lerp(ringFrom[i * 3 + 2], Math.sin(i * 7.3) * 0.08, k); }
    ringGeo.attributes.position.needsUpdate = true; }

  composer.render();
  return out;
};
window.ready = true;
</script></body></html>
