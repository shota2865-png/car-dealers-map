<script type="module">

// ---------- 乱数（毎回同じ絵になるように） ----------

  {name: 'amyg', p: new THREE.Vector3(0.55, -0.35, 0.25), c: new THREE.Color(0xff5a3c)},
  {name: 'hippo', p: new THREE.Vector3(-0.6, -0.3, -0.15), c: GOLD},
  {name: 'pfc', p: new THREE.Vector3(0.0, 0.35, 1.05), c: CYAN},

  m.position.copy(h.p); brainGroup.add(m); return m;

const pulseMat = pointsMat(0.05, 0); const pulsePts = new THREE.Points(pulseGeo, pulseMat); brainGroup.add(pulsePts);

// ---------- 群衆（1,200 人）と床 ----------
const crowd = new THREE.Group(); scene.add(crowd);
const grid = new THREE.GridHelper(60, 120, 0x22d3ee, 0x0b3a4a); grid.material.transparent = true; grid.material.opacity = 0; crowd.add(grid);
const body = new THREE.CylinderGeometry(0.09, 0.12, 0.42, 10); body.translate(0, 0.21, 0);
const head = new THREE.SphereGeometry(0.085, 14, 14); head.translate(0, 0.53, 0);

const personMat = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0});

const pStart = [], pEnd = [], pLit = [];
const leftLit = new Set(), rightLit = new Set();
for (let i = 0; i < CN; i++) {

  const a = k * 2.399963, r = Math.sqrt(k) * 0.115;          // ひまわりの配置で 2 つの丸い集団に

  pLit.push(false);
}
// 左（24 種類）は 3%、右（6 種類）は 30% が「買った人」= 光る
for (let i = 0; i < CN; i += 2) if (rnd() < 0.03) leftLit.add(i);
for (let i = 1; i < CN; i += 2) if (rnd() < 0.30) rightLit.add(i);
people.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const pc = new THREE.Color();
for (let i = 0; i < CN; i++) { people.setColorAt(i, pc.set(0x1d3550)); }
crowd.add(people);
// 立ち上がる半透明の柱（3% と 30%）
function bar(color) {
  const g = new THREE.BoxGeometry(1.6, 1, 1.6); g.translate(0, 0.5, 0);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false}));

barL.position.set(-3.4, 0, -3.2); barR.position.set(3.4, 0, -3.2); crowd.add(barL, barR);

// ---------- データの輪（めたんの場面の背景）と、検証カードの通路 ----------
const rings = new THREE.Group(); scene.add(rings);
for (let k = 0; k < 7; k++) {
  const r = 1.4 + k * 0.42, arc = Math.PI * (0.6 + rnd() * 1.3);
  const g = new THREE.TorusGeometry(r, 0.006 + (k % 3) * 0.004, 6, 160, arc);

  m.rotation.set(Math.PI / 2 - 0.9 + (rnd() - .5) * .5, (rnd() - .5) * .6, rnd() * 6); m.userData.sp = (rnd() - .5) * 0.6; rings.add(m);
}
const cardTex = ['card_0.png', 'card_1.png', 'card_2.png', 'card_3.png'].map(f => { const t = new THREE.TextureLoader().load(f); t.colorSpace = THREE.SRGBColorSpace; return t; });

const DN = 2500, dustGeo = new THREE.BufferGeometry(), dPos = new Float32Array(DN * 3), dCol = new Float32Array(DN * 3);

const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), sc1 = new THREE.Vector3(1, 1, 1), tmp = new THREE.Vector3();

  } else if (t < 38.5) {

    cam.position.set(Math.sin(k * 0.8 - 0.4) * 6.2, 0.4, Math.cos(k * 0.8 - 0.4) * 6.2); cam.lookAt(-1.4, 0, 0);

  // ---- 2D に渡す座標 ----
  if (t >= 8 && t < 14.5) out.hubs = hubMeshes.map(m => project(worldOf(brainGroup, m.position)));
  bloom.strength = (t >= 14.3 && t < 26) ? 0.55 : (t >= 38.3 && t < 50.4) ? 0.6 : (t >= 50 ? lerp(1.1, 0.8, seg(t, 53.0, 55.0)) : 1.1);
  composer.render();
  return out;
};
window.ready = true;
</script></body></html>
