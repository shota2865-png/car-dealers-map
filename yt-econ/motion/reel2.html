const Lens = {

// ======================================================================
// 1) 神経細胞の星空ドーム（カメラはドームの中心）
// ======================================================================
const dome = new THREE.Group(); scene.add(dome);

const synGeo = new THREE.BufferGeometry(), sp = new Float32Array(synEdges.length * 6), sc = new Float32Array(synEdges.length * 6);
synEdges.forEach(([a, b], k) => { sp.set([...neurons[a].toArray(), ...neurons[b].toArray()], k * 6); const c = rnd() < .5 ? CYAN : TEAL; sc.set([c.r, c.g, c.b, c.r, c.g, c.b], k * 6); });

const tessMat = new THREE.LineBasicMaterial({vertexColors: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false});

const BN = 46000, bBase = new Float32Array(BN * 3);

const CN = 2400, people = new THREE.InstancedMesh(personGeo, new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0}), CN);
const pDir = [], litL = new Set(), litR = new Set();

planet.add(atmo);

// ======================================================================

// ======================================================================
const flowN = 14000, flowGeo = new THREE.BufferGeometry(), flowPos = new Float32Array(flowN * 3), flowCol = new Float32Array(flowN * 3), flowSeed = [];
for (let i = 0; i < flowN; i++) { const r = 2 + rnd() * 16, a = rnd() * Math.PI * 2; flowSeed.push([r, a, (rnd() - .5) * 10, 0.2 + rnd()]); const c = rnd() < .6 ? CYAN : (rnd() < .5 ? MAG : VIO); const v = .3 + rnd() * .6; flowCol.set([c.r * v, c.g * v, c.b * v], i * 3); }

// 6) ロゴの輪（すべての粒子が集まる）
// ======================================================================

// ---------- 2D へ渡す座標 ----------
const tmp = new THREE.Vector3();
function project(v) { tmp.copy(v).project(cam); return [Math.round((tmp.x + 1) / 2 * W), Math.round((1 - tmp.y) / 2 * H), tmp.z < 1 ? 1 : 0]; }

// ======================================================================
// 時間ごと
// ======================================================================
window.renderAt = (t) => {
  const out = {};
  // ---- 1) ドーム 0〜10 秒（と、めたんの場面 44〜54 秒の背景にも） ----
  const domeK = Math.max(win(t, -1, 10.6, 1.2), win(t, 43.6, 54.6, 1.0) * 0.6);
  dome.visible = domeK > 0.01;
  domePts.material.opacity = domeK; band.material.opacity = 0.8 * domeK;
  synGeo.setDrawRange(0, Math.floor(synEdges.length * 2 * easeOut(seg(t, 2.5, 7.5))) );
  synMat.opacity = 0.6 * domeK; sigMat.opacity = domeK * seg(t, 4, 6);
  if (dome.visible) {
    sigs.forEach((s, i) => { const [a, b] = synEdges[s.e]; const f = (s.o + t * s.s) % 1; spPos.set([lerp(neurons[a].x, neurons[b].x, f), lerp(neurons[a].y, neurons[b].y, f), lerp(neurons[a].z, neurons[b].z, f)], i * 3); });
    spGeo.attributes.position.needsUpdate = true;
    dome.rotation.y = t * 0.03; dome.rotation.x = 0.15 * Math.sin(t * 0.1);
  }
  // ---- 2) 4D 10〜21 秒 ----
  const fourK = win(t, 9.6, 21.4, 1.0);
  four.visible = fourK > 0.01;
  if (four.visible) {
    updateFour(t);
    const morph = ease(seg(t, 14.5, 16.5));                 // テッセラクト → ホップ・ファイブレーション
    tessMat.opacity = fourK * (1 - morph); tvMat.opacity = fourK * (1 - morph);
    hopfMat.opacity = fourK * morph * 0.85;
  }
  // ---- 3) 脳 21〜33 秒 ----
  const brainK = win(t, 20.6, 33.4, 1.0);
  brainG.visible = brainK > 0.01;
  brainPts.material.opacity = 0.85 * brainK;
  if (brainG.visible) {
    // 時間で移る活動: 3 つの中心が順に光り、その近くの点の色が変わる（波のように）
    const act = hubs.map((h, k) => Math.max(0, Math.sin((t - 22.5 - k * 2.6) * 0.9)) * seg(t, 22 + k * 2.6, 23 + k * 2.6));
    for (let i = 0; i < BN; i++) {
      const x = bBase[i * 3], y = bBase[i * 3 + 1], z = bBase[i * 3 + 2];
      let r = bCol0[i * 3], g = bCol0[i * 3 + 1], b = bCol0[i * 3 + 2];
      for (let k = 0; k < 3; k++) {
        if (act[k] <= 0) continue;
        const h = hubs[k].p, dd = (x - h.x) ** 2 + (y - h.y) ** 2 + (z - h.z) ** 2;
        const w = Math.min(1, act[k] * 1.3 * Math.exp(-dd * 3.2) * (0.65 + 0.35 * Math.sin(t * 7 + dd * 30)));
        r = lerp(r, hubs[k].c.r * 2.2, w); g = lerp(g, hubs[k].c.g * 2.2, w); b = lerp(b, hubs[k].c.b * 2.2, w);
      }
      bCol[i * 3] = r; bCol[i * 3 + 1] = g; bCol[i * 3 + 2] = b;
    }
    brainPts.geometry.attributes.color.needsUpdate = true;
    brainG.rotation.y = 0.15 * Math.sin(t * 0.3);
    orbit.children.forEach((m, k) => { m.material.opacity = 0.7 * brainK; m.rotation.z = t * m.userData.s + k; });
    out.hubs = hubs.map(h => project(brainG.localToWorld(h.p.clone())));
    out.act = act;
  }
  // ---- 4) 惑星 33〜44 秒 ----
  const plK = win(t, 32.6, 44.4, 1.0);
  planet.visible = plK > 0.01;
  wire.material.opacity = 0.6 * plK; core.material.opacity = 0.95 * plK; people.material.opacity = plK; atmo.material.opacity = 0.6 * plK;
  if (planet.visible) {
    for (let i = 0; i < CN; i++) {
      const L = litL.has(i), R = litR.has(i);
      const on = (L && t > 37.0) || (R && t > 37.8);
      pc.set(0x24456a).lerp(GOLD, on ? clamp((t - (L ? 37.0 : 37.8)) * 3) * 0.7 : 0); people.setColorAt(i, pc);
    }
    people.instanceColor.needsUpdate = true;
    beams.children.forEach(b => { const st = b.userData.L ? 37.3 : 38.1; const k = easeOut(seg(t, st, st + 1.4)); b.scale.set(1, 0.001 + b.userData.h * k, 1); b.material.opacity = 0.32 * k * plK; });
    planet.rotation.set(0, 0, 0);
    out.groupL = project(cL.clone().multiplyScalar(PR + 0.05).applyEuler(planet.rotation));
    out.groupR = project(cR.clone().multiplyScalar(PR + 0.05).applyEuler(planet.rotation));
  }
  // ---- 5) 4D ノイズの渦 44〜54 秒 ----
  const flK = win(t, 43.4, 54.6, 1.0);
  flow.visible = flK > 0.01; flowMat.opacity = flK;
  if (flow.visible) {
    for (let i = 0; i < flowN; i++) {
      const [r, a, y, s] = flowSeed[i];
      const ang = a + t * 0.12 * s + 0.35 * Math.sin(r * 0.4 + t * 0.5);
      const rr = r + 0.8 * Math.sin(a * 3 + t * 0.7 * s);
      flowPos.set([Math.cos(ang) * rr, y + 1.2 * Math.sin(ang * 2 + t * 0.4), Math.sin(ang) * rr], i * 3);
    }
    flowGeo.attributes.position.needsUpdate = true;
  }
  // ---- 6) ロゴの輪 53〜60 秒 ----
  const rgK = seg(t, 52.6, 53.6);
  ring.visible = rgK > 0.01; ringMat.opacity = rgK * (1 - seg(t, 59.2, 60));
  if (ring.visible) {
    for (let i = 0; i < ringN; i++) {
      const k = ease(seg(t, 53.0 + ringA[i] * 1.6, 55.0 + ringA[i] * 1.6));
      const a = i * 2.399963 + t * 0.3, rr = 2.2 + Math.sin(i * 12.9898) * 0.12;
      ringPos[i * 3] = lerp(ringFrom[i * 3], Math.cos(a) * rr, k);
      ringPos[i * 3 + 1] = lerp(ringFrom[i * 3 + 1], Math.sin(a) * rr, k);
      ringPos[i * 3 + 2] = lerp(ringFrom[i * 3 + 2], Math.sin(i * 7.3) * 0.08, k);
    }
    ringGeo.attributes.position.needsUpdate = true;
  }

  // ---- カメラとレンズ ----
  let fish = 0.35, fov = 70, rays = 0;
  if (t < 10.6) {             // ドームの中心から見上げて、ゆっくり回る
    const k = ease(seg(t, 0, 10.6));
    cam.position.set(0, 0, 0); fov = lerp(95, 80, k); fish = 0.55;
    cam.lookAt(Math.sin(t * 0.08) * 10, lerp(-2, 14, k), -20);
  } else if (t < 21.4) {      // 4D の形の周りを回る
    const k = seg(t, 10.6, 21.4), a = k * 2.4 + 0.3, r = lerp(5.2, 3.6, ease(k));
    cam.position.set(Math.sin(a) * r, 0.8 * Math.sin(k * 3), Math.cos(a) * r); cam.lookAt(0, 0, 0); fov = 62; fish = 0.4;
  } else if (t < 33.4) {      // 脳に寄って、光の筋
    const k = seg(t, 21.4, 33.4), a = -1.35 + k * 0.9;
    const r = lerp(5.4, 3.0, ease(seg(t, 21.4, 27)));
    cam.position.set(Math.sin(a) * r, lerp(1.6, 0.4, ease(k)), Math.cos(a) * r); cam.lookAt(0, -0.05, 0); fov = 58; fish = 0.3;
    rays = 0.5 * brainK; lensPass.uniforms.sun.value.set(0.5, 0.5);
  } else if (t < 44.4) {      // 惑星の地平線すれすれ → 上空へ
    const k = seg(t, 33.4, 44.4);
    const h = lerp(1.6, 6.0, ease(seg(t, 38.6, 43.8)));
    const a = lerp(-0.35, 0.3, k);
    const p = new THREE.Vector3(Math.sin(a) * 0.9, 1, Math.cos(a) * 0.9 + 0.25).normalize().multiplyScalar(PR + h);
    cam.position.copy(p); cam.up.set(0, 1, 0);
    cam.lookAt(0, PR * 0.86, 0.25); fov = lerp(68, 60, k); fish = 0.5;
    rays = 0.25 * seg(t, 37.3, 39) * plK;
    const sp2 = project(new THREE.Vector3(0, PR + 6, 0)); lensPass.uniforms.sun.value.set(sp2[0] / W, 1 - sp2[1] / H);
  } else if (t < 53) {        // めたん: 渦の中心
    const k = seg(t, 44.4, 53);
    cam.position.set(Math.sin(k * 0.6) * 1.5, 0.6, 6 - k * 1.2); cam.lookAt(-1.2, 0.4, 0); fov = 75; fish = 0.45;
  } else {                    // ロゴ
    const k = ease(seg(t, 53, 56));
    cam.position.set(0, 0, lerp(14, 7.2, k)); cam.lookAt(0, 0, 0); fov = 50; fish = lerp(0.6, 0.25, k);
    rays = 0.5 * seg(t, 55, 56) * (1 - seg(t, 58.5, 60)); lensPass.uniforms.sun.value.set(0.5, 0.5);
  }
  cam.fov = fov; cam.updateProjectionMatrix();
  lensPass.uniforms.fish.value = fish; lensPass.uniforms.rays.value = rays;
  bloom.strength = (t >= 32.6 && t < 44.4) ? 0.55 : (t >= 20.6 && t < 33.4) ? 0.6 : 1.0;
  if (t >= 33.4 && t < 44.4) { out.groupL = project(cL.clone().multiplyScalar(PR + 0.05)); out.groupR = project(cR.clone().multiplyScalar(PR + 0.05)); }
  composer.render();
  return out;
};
window.ready = true;
</script></body></html>
