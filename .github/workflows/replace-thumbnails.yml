name: 投稿済みの動画のサムネを差し替える

# ------------------------------------------------------------
# yt-econ/thumbnails/replace/<チャンネル>/<動画ID>.jpg を置いて main に入れると、その動画のサムネを差し替える。
#   - main（おやすみ経済学）: thumbnails/replace/main/
#   - psych（心理学）      : thumbnails/replace/psych/
# push のときは、その push で増えた・変わった画像だけを付ける。
# 手で動かす（Run workflow）ときは、置いてある画像をすべて付け直す。
# 秘密情報は daily-upload.yml と同じ（YOUTUBE_* / PSY_YOUTUBE_*）
# ------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - "yt-econ/thumbnails/replace/**"
  workflow_dispatch:

concurrency:
  group: ytecon-replace-thumbnails
  cancel-in-progress: false

env:
  PYTHONPATH: src
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  PSY_YOUTUBE_CLIENT_ID: ${{ secrets.PSY_YOUTUBE_CLIENT_ID }}
  PSY_YOUTUBE_CLIENT_SECRET: ${{ secrets.PSY_YOUTUBE_CLIENT_SECRET }}
  PSY_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PSY_YOUTUBE_REFRESH_TOKEN }}

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: yt-econ

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yt-econ/requirements.txt

      - name: Python 依存を入れる
        run: pip install -r requirements.txt

      - name: 差し替える画像を決める
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- thumbnails/replace \
              | sed 's#^yt-econ/##' > ../replace-list.txt
          else
            find thumbnails/replace -type f \( -name '*.jpg' -o -name '*.png' \) | sort > ../replace-list.txt
          fi
          cat ../replace-list.txt

      - name: 差し替える
        run: |
          : > replace-report.txt
          fail=0
          while read -r f; do
            [ -n "$f" ] || continue
            ch=$(basename "$(dirname "$f")")
            id=$(basename "$f"); id="${id%.*}"
            case "$ch" in main|psych) ;; *) echo "チャンネルが分からない: $f" | tee -a replace-report.txt; continue ;; esac
            if YTECON_CHANNEL="$ch" python -m ytecon thumbnail "$f" --video-id "$id" >> replace-report.txt 2>&1; then
              echo "OK  $ch $id" | tee -a replace-report.txt
            else
              echo "NG  $ch $id" | tee -a replace-report.txt
              fail=1
            fi
          done < ../replace-list.txt
          { echo "## サムネの差し替え"; echo '```'; cat replace-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
