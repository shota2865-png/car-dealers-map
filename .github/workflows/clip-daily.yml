name: 毎日 マックスむらい切り抜き Shorts 10本を18時に予約投稿

# ------------------------------------------------------------
# むらいクリップ【切り抜き】（@maxmuraiclip）用。中身は yt-clip/。
# GitHub のサーバーで動くので、Mac も Claude も起動していなくていい。Claude のクレジットも使わない
# （場面選びは YouTube のチャット・ヒートマップ・自動字幕、タイトルは GitHub Models の無料枠）。
#
# 必要な設定（Settings → Secrets and variables → Actions）:
#   CLIP_YOUTUBE_CLIENT_ID / CLIP_YOUTUBE_CLIENT_SECRET   Google Cloud の OAuth クライアント（経済と同じものでも可）
#   CLIP_YOUTUBE_REFRESH_TOKEN   むらいクリップのアカウントで許可して取る（yt-clip/README.md）
#   YTDLP_COOKIES                任意。GitHub のサーバーが YouTube に弾かれるときだけ（捨てアカウントの cookies.txt の中身）
# 鍵が無い間は動画を作るだけで投稿しない（成果物から mp4 を確認できる）。
# ------------------------------------------------------------

on:
  schedule:
    # JST 9:20 開始。GitHub の予約実行は数時間遅れることがあるので 18:00 の予約に間に合うよう早めに始める
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "本数（空なら config の 10 本）"
        default: ""
      upload:
        description: "YouTube に投稿するか（false なら mp4 を成果物に残すだけ）"
        type: boolean
        default: true

permissions:
  contents: read
  models: read          # GitHub Models（タイトル付け）を GITHUB_TOKEN で使う

concurrency:
  group: clip-daily
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: yt-clip
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLIP_YOUTUBE_CLIENT_ID: ${{ secrets.CLIP_YOUTUBE_CLIENT_ID }}
      CLIP_YOUTUBE_CLIENT_SECRET: ${{ secrets.CLIP_YOUTUBE_CLIENT_SECRET }}
      CLIP_YOUTUBE_REFRESH_TOKEN: ${{ secrets.CLIP_YOUTUBE_REFRESH_TOKEN }}
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yt-clip/requirements.txt

      # yt-dlp が YouTube の署名を解くのに使う
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: ffmpeg と依存を入れる
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U -r requirements.txt

      - name: cookies（設定されているときだけ）
        if: env.YTDLP_COOKIES != ''
        run: |
          printf '%s\n' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"

      # 切り抜き済みの場面・投稿履歴（同じ場面を二度出さないため）。path は変えないこと
      - name: 前回までの状態を復元
        uses: actions/cache/restore@v4
        with:
          path: yt-clip/state
          key: clip-state-${{ github.run_id }}
          restore-keys: clip-state-

      - name: 作って予約投稿
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.count }}" ]; then ARGS="$ARGS --count ${{ github.event.inputs.count }}"; fi
          if [ "${{ github.event.inputs.upload }}" = "false" ] || [ -z "$CLIP_YOUTUBE_REFRESH_TOKEN" ]; then
            [ -z "$CLIP_YOUTUBE_REFRESH_TOKEN" ] && echo "::notice::CLIP_YOUTUBE_REFRESH_TOKEN が未設定なので、作るだけで投稿しません"
            ARGS="$ARGS --no-upload --state $RUNNER_TEMP/dry-state.json"
          fi
          python -m clip $ARGS | tee run.log
          { echo "## 切り抜き"; echo '```'; grep -E "予約しました|作りました|作れません|投稿できません|候補|完了|止めます" run.log | tail -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 状態を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: yt-clip/state
          key: clip-state-${{ github.run_id }}

      - name: できた動画を残す（7日）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          retention-days: 7
          path: yt-clip/out/*.mp4
          if-no-files-found: ignore
