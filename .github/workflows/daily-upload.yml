name: 毎日2本を自動生成して投稿

# ------------------------------------------------------------
# GitHub のサーバーで動くので、あなたのパソコンには何も入れません。
# タブを閉じても消えません。決めた時刻に勝手に動きます。
#
# 必要な設定（リポジトリの Settings → Secrets and variables → Actions）:
#   CLAUDE_CODE_OAUTH_TOKEN   claude setup-token で作る（サブスクの枠で台本生成）
#   YOUTUBE_CLIENT_ID         Google Cloud Console
#   YOUTUBE_CLIENT_SECRET     同上
#   YOUTUBE_REFRESH_TOKEN     scripts/auth_youtube.py で取得
#   PEXELS_API_KEY            任意（無ければグラデーション背景）
# ------------------------------------------------------------

on:
  schedule:
    # UTC 表記。JST 06:00 と JST 18:00 に生成を始め、予約投稿で 07:30 / 19:30 に公開する
    - cron: "0 21 * * *"   # JST 06:00
    - cron: "0 9 * * *"    # JST 18:00
  workflow_dispatch:
    inputs:
      count:
        description: "作る本数"
        default: "1"
      upload:
        description: "YouTube に投稿するか（false にすると mp4 を成果物として残すだけ）"
        type: boolean
        default: true

concurrency:
  group: ytecon-daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: yt-econ

    services:
      # ずんだもんの声。コンテナとして横で立てるので、何も入れなくていい
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yt-econ/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ffmpeg を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Python 依存を入れる
        run: pip install -r requirements.txt

      # 台本生成は Claude Code の headless モードで行う。
      # サブスクのトークンを使うので、API の従量課金が発生しない
      - name: Claude Code を入れる
        run: npm install -g @anthropic-ai/claude-code

      # 過去に扱った話題の記憶（state.sqlite3）を持ち越す。
      # これが無いと毎回同じテーマを作ってしまう
      - name: 前回までの状態を復元
        uses: actions/cache/restore@v4
        with:
          path: yt-econ/output/state.sqlite3
          key: ytecon-state-${{ github.run_id }}
          restore-keys: ytecon-state-

      - name: VOICEVOX の起動待ち
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:50021/version && break
            sleep 2
          done

      - name: 環境チェック
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YTECON_LLM_PROVIDER: claude_code
          VOICEVOX_URL: http://127.0.0.1:50021
        run: python -m ytecon doctor || true

      - name: 生成して投稿
        env:
          PYTHONPATH: src
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YTECON_LLM_PROVIDER: claude_code
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VOICEVOX_URL: http://127.0.0.1:50021
        run: |
          python -m ytecon run \
            -n "${{ github.event.inputs.count || 1 }}" \
            ${{ github.event.inputs.upload == 'false' && '--no-upload' || '' }}

      # 寝かせた動画のテーマが日本で話題化していないか毎日照合する。
      # 生成が失敗した日でも、こちらは回しておく価値がある
      - name: 寝かせた動画の掘り起こし
        if: always()
        env:
          PYTHONPATH: src
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YTECON_LLM_PROVIDER: claude_code
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m ytecon revive | tee revive-report.txt

      - name: 掘り起こしレポートをサマリに出す
        if: always()
        run: cat revive-report.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: 状態を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: yt-econ/output/state.sqlite3
          key: ytecon-state-${{ github.run_id }}

      # 投稿しない設定のときは、できた mp4 をここからダウンロードできる
      - name: 成果物を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytecon-${{ github.run_id }}
          retention-days: 7
          path: |
            yt-econ/output/**/video.mp4
            yt-econ/output/**/script.json
            yt-econ/output/**/metadata.json
            yt-econ/output/**/subtitles.srt
            yt-econ/output/**/thumbnail.jpg
